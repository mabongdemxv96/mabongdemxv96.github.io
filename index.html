<style>:root {
  --ink: #1d2433; --muted: #5b6475; --line: #e3e6ec; --bg: #f6f7f9; --card: #fff;
  --gold: #e9a908; --gold-soft: #fff6dc; --blue: #1f5fa8; --blue-soft: #e8f0fa;
  --ds: #1f5fa8; --hh: #18875a; --tk: #7a4bc2; --th: #6b7280;
  --ok: #18875a; --ok-soft: #e6f5ee; --bad: #c2410c; --bad-soft: #fdecdf;
  --r: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
code { font-size: .9em; background: #eef0f4; padding: 1px 5px; border-radius: 4px; }
a { color: var(--blue); text-decoration: none; }
button { font: inherit; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.logo { background: var(--gold); color: #fff; font-weight: 800; border-radius: 8px; padding: 6px 8px; font-size: 13px; letter-spacing: .5px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 6px 12px; border-radius: 999px; color: var(--muted); }
nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.foot { max-width: 1100px; margin: 0 auto 30px; padding: 0 20px; color: var(--muted); font-size: 13px; }
.link { background: none; border: 0; color: var(--blue); padding: 0; text-decoration: underline; }
h1 { font-size: 24px; margin: 4px 0 6px; } h2 { font-size: 19px; margin: 24px 0 10px; } h3 { font-size: 16px; margin: 16px 0 8px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef0f4; color: var(--muted); white-space: nowrap; }
.chip.DS { background: #e8f0fa; color: var(--ds); } .chip.HH { background: #e6f5ee; color: var(--hh); }
.chip.TK { background: #f1ebfa; color: var(--tk); } .chip.TH { background: #f0f1f3; color: var(--th); }
.chip.gold { background: var(--gold-soft); color: #946b00; } .chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.star { background: #fff1f2; color: #be123c; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { height: 8px; background: #eceef2; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

/* Lộ trình */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-bottom: 8px; }
.next { border-left: 4px solid var(--gold); }
.tabs { display: flex; gap: 6px; margin: 18px 0 10px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
.tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.week { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.week:first-child { border-top: 0; }
.wk { font-weight: 700; color: var(--muted); font-size: 13px; padding-top: 10px; }
.sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ses { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); position: relative; }
.ses:hover { border-color: #b9c3d3; }
.ses.co { border-left: 4px solid var(--gold); }
.ses.xong { background: var(--ok-soft); border-color: #bfe3cf; }
.ses.thi { background: #fbf7ea; }
.ses .t { font-weight: 600; font-size: 14px; margin: 4px 0 6px; }
.ses .ma { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Buổi học */
.crumb { font-size: 13px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; margin-top: 14px; }
.steps { position: sticky; top: 70px; display: grid; gap: 4px; }
.steps button { text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 10px; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.steps button.on { background: var(--card); border-color: var(--line); font-weight: 600; }
.steps .n { width: 22px; height: 22px; border-radius: 50%; background: #e7eaf0; display: inline-grid; place-items: center; font-size: 12px; flex: none; }
.steps button.done .n { background: var(--ok); color: #fff; }
.pane > .card + .card { margin-top: 12px; }
.theory { background: var(--blue-soft); border: 1px solid #c9dbf1; }
.method { background: var(--gold-soft); border: 1px solid #f3dc97; }
.method h3, .theory h3 { margin-top: 0; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
.sol { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.sol ol { margin: 0; padding-left: 22px; } .sol li { margin: 4px 0; }
.sol li.hide { display: none; }
.video { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
.screen { aspect-ratio: 16/9; background: #10151f; border-radius: 10px; color: #cdd5e3; display: grid; place-items: center; text-align: center; padding: 16px; position: relative; }
.screen .now { font-size: 18px; font-weight: 600; color: #fff; margin-top: 8px; }
.screen .tm { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #93a0b6; }
.chap { display: grid; gap: 4px; }
.chap button { text-align: left; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.chap button.on { border-color: var(--gold); background: var(--gold-soft); }
.q { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.q + .q { margin-top: 10px; }
.q .hd { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.opt { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 8px 10px; display: flex; gap: 8px; align-items: baseline; }
.opt b { color: var(--muted); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ds { width: 100%; border-collapse: collapse; margin-top: 8px; }
.ds td { border-top: 1px solid var(--line); padding: 7px 4px; vertical-align: middle; }
.ds td.c { width: 112px; text-align: right; white-space: nowrap; }
.ds button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 9px; margin-left: 4px; }
.ds button.sel { background: var(--blue); color: #fff; border-color: var(--blue); }
.ds tr.right td { background: var(--ok-soft); } .ds tr.wrong td { background: var(--bad-soft); }
.tln { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.tln input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 140px; font: inherit; }
.fb { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); } .fb.bad { background: var(--bad-soft); color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; }
.score { font-size: 40px; font-weight: 800; }
.skills { display: grid; gap: 8px; }
.sk { display: grid; grid-template-columns: 90px 1fr 140px; gap: 10px; align-items: center; }
table.tb { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13px; }
table.tb th, table.tb td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.tb th { background: #f3f4f7; font-weight: 600; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #d7dbe3; }
.dot.on { background: var(--ok); }
.banner { background: var(--gold-soft); border: 1px solid #f3dc97; border-radius: var(--r); padding: 10px 14px; font-size: 14px; }
@media (max-width: 760px) {
  .hero, .layout, .video { grid-template-columns: 1fr; }
  .steps { position: static; grid-template-columns: repeat(3, 1fr); }
  .steps > div { grid-column: 1 / -1; }
  .opts { grid-template-columns: 1fr; }
  .week { grid-template-columns: 1fr; } .wk { padding-top: 0; }
  .sk { grid-template-columns: 70px 1fr; } .sk .bar { grid-column: 1 / -1; }
}

<style>/* Website thương hiệu — mọi lớp có tiền tố s- để không đụng giao diện lộ trình (style.css). */
:root {
  --navy: #14284b; --navy-2: #1f3a68; --navy-3: #0c1a33; --gold: #f2b705; --gold-2: #d99a00; --cream: #fffaf0;
  --s-ink: #172036; --s-muted: #5d667a; --s-line: #e5e8ef; --s-bg: #f6f8fb; --s-ok: #18875a;
}
body { font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: var(--s-ink); }
.s-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
section[id] { scroll-margin-top: 72px; }
.s-ic { width: 22px; height: 22px; flex: none; }

/* Header */
.s-header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.94); backdrop-filter: saturate(160%) blur(10px); border-bottom: 1px solid var(--s-line); }
.s-header-in { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
.s-brand { display: flex; align-items: center; gap: 10px; color: var(--s-ink); }
.s-brand-t b { display: block; font-size: 18px; letter-spacing: -.2px; }
.s-brand-t small { display: block; font-size: 12px; color: var(--s-muted); }
.s-nav { display: flex; gap: 2px; align-items: center; }
.s-nav a { padding: 8px 13px; border-radius: 999px; color: var(--s-muted); font-weight: 500; font-size: 15px; }
.s-nav a:hover { color: var(--s-ink); background: var(--s-bg); }
.s-nav a.on { color: var(--navy); background: #edf1f8; font-weight: 600; }
.s-nav a.s-nav-cta { background: var(--gold); color: var(--navy); font-weight: 700; margin-left: 6px; box-shadow: 0 4px 14px rgba(242,183,5,.35); }
.s-nav a.s-nav-cta:hover, .s-nav a.s-nav-cta.on { background: #ffc61a; color: var(--navy); }
.s-burger { display: none; background: none; border: 1px solid var(--s-line); border-radius: 10px; padding: 6px 11px; font-size: 18px; }

/* Nút */
.s-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 15px; border: 1px solid transparent; transition: transform .15s, box-shadow .15s, background .15s; cursor: pointer; font-family: inherit; }
.s-btn:hover { transform: translateY(-1px); }
.s-btn.lg { padding: 15px 24px; font-size: 16px; font-weight: 700; }
.s-btn.sm { padding: 7px 12px; font-size: 14px; margin-top: 8px; }
.s-btn.full { width: 100%; }
.s-btn.gold { background: var(--gold); color: var(--navy); box-shadow: 0 8px 24px rgba(242,183,5,.38); }
.s-btn.gold:hover { background: #ffc61a; }
.s-btn.navy { background: var(--navy); color: #fff; }
.s-btn.ghost { border-color: rgba(255,255,255,.35); color: #fff; }
.s-btn.ghost:hover { background: rgba(255,255,255,.08); }
.s-btn.line { border-color: var(--s-line); color: var(--s-ink); background: #fff; }
.s-pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #eef0f4; color: var(--s-muted); }
.s-pill.ok { background: #e6f5ee; color: var(--s-ok); }

/* Hero */
.s-hero { background: radial-gradient(900px 480px at 80% -10%, #2b4c86 0%, transparent 60%), linear-gradient(160deg, var(--navy) 0%, var(--navy-3) 100%); color: #fff; }
.s-hero-in { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; padding: 72px 24px 84px; }
.s-eyebrow { display: inline-flex; gap: 8px; align-items: center; background: rgba(242,183,5,.14); color: var(--gold); border: 1px solid rgba(242,183,5,.35); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.s-eyebrow .s-ic { width: 16px; height: 16px; }
.s-hero h1 { margin: 20px 0 18px; font-weight: 800; letter-spacing: -2px; line-height: 1.02; font-size: clamp(48px, 7vw, 84px); }
.s-hero h1 span { display: block; }
.s-hero h1 span.hl { color: var(--gold); }
.s-hero .lead { font-size: 18px; color: #c9d4e8; max-width: 540px; margin: 0 0 30px; }
.s-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.s-trust { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 26px; color: #c9d4e8; font-size: 14px; }

/* Tháp đếm ngược */
.s-tower { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.s-tower-hd { display: inline-flex; gap: 8px; align-items: center; color: #9fb0cf; font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
.s-tower-hd .s-ic { color: var(--gold); width: 18px; height: 18px; }
.s-tier { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
.s-tier-t b { display: block; font-size: 14.5px; font-weight: 600; }
.s-tier-t span { font-size: 12.5px; color: #9fb0cf; }
.s-tier-n { font-size: 13px; color: #c9d4e8; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.s-tier-n b { color: #fff; font-size: 16px; }
.s-tier-n .s-ic { width: 16px; height: 16px; color: #6fd3a2; }
.s-tier.past { opacity: .55; }
.s-tier.goal { flex-direction: column; text-align: center; background: linear-gradient(160deg, #ffcf3a, var(--gold)); color: var(--navy); border: 0; padding: 18px 16px 16px; box-shadow: 0 16px 40px rgba(242,183,5,.25); }
.s-tier.goal .s-tier-t b { font-size: 16px; font-weight: 700; }
.s-tier.goal .s-tier-t span { color: #5b4a00; }
.s-big { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.s-big small { font-size: 18px; letter-spacing: 0; margin-left: 6px; font-weight: 700; }

/* Khối chung */
.s-sec { padding: 88px 0; }
.s-sec.alt { background: var(--s-bg); }
.s-head { text-align: center; margin-bottom: 40px; }
.s-kicker { display: block; color: var(--gold-2); font-weight: 700; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; }
.s-sec h2, .s-reg h2 { font-size: clamp(28px, 3.6vw, 42px); letter-spacing: -1px; margin: 8px 0 0; line-height: 1.15; }

/* Tất cả trong một */
.s-feat { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.s-feat-i { background: #fff; border: 1px solid var(--s-line); border-radius: 18px; padding: 22px 16px; text-align: center; transition: transform .15s, box-shadow .15s; }
.s-feat-i:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(20,40,75,.08); }
.s-feat-ic { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--navy); color: var(--gold); }
.s-feat-ic .s-ic { width: 26px; height: 26px; }
.s-feat-i b { display: block; font-size: 15.5px; margin-bottom: 4px; }
.s-feat-i span { font-size: 13.5px; color: var(--s-muted); }
.s-diff { max-width: 820px; margin: 44px auto 0; border: 1px solid var(--s-line); border-radius: 18px; overflow: hidden; }
.s-diff-hd, .s-diff-r { display: grid; grid-template-columns: 1.3fr .9fr 1.1fr; align-items: center; }
.s-diff-hd span { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--s-muted); background: var(--s-bg); }
.s-diff-hd span.me { background: var(--navy); color: var(--gold); }
.s-diff-r span { padding: 13px 16px; border-top: 1px solid var(--s-line); font-size: 15px; display: flex; gap: 6px; align-items: center; }
.s-diff-r .no { color: #c0392b; } .s-diff-r .no .s-ic { width: 18px; height: 18px; }
.s-diff-r .yes { background: #f2f6fc; color: var(--navy); font-weight: 600; } .s-diff-r .yes .s-ic { color: var(--s-ok); width: 18px; height: 18px; }

/* Học sinh & phụ huynh */
.s-split { display: grid; grid-template-columns: .9fr 1.1fr; gap: 48px; align-items: center; }
.s-ticks { list-style: none; padding: 0; margin: 24px 0 28px; display: grid; gap: 14px; }

.s-ph-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
.s-ph-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 10px; font-size: 13px; color: var(--s-muted); }

.s-rp-hd small, .s-rp-grid small, .s-rp-sk > small { display: block; font-size: 12px; color: var(--s-muted); }

.s-rp-bar { height: 7px; background: #eceef2; border-radius: 9px; overflow: hidden; }
.s-rp-bar i { display: block; height: 100%; border-radius: 9px; }
.s-rp-note { display: flex; gap: 8px; margin-top: 14px; padding: 10px 12px; background: var(--cream); border: 1px solid #f6e3a6; border-radius: 12px; font-size: 13px; color: #4a4120; }
.s-rp-note .s-ic { color: var(--gold-2); width: 18px; height: 18px; }

/* Triết lý */
.s-band { background: linear-gradient(150deg, var(--navy), var(--navy-2)); color: #fff; padding: 72px 0; text-align: center; }
.s-band-q { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -.8px; margin-bottom: 40px; }
.s-flow { display: flex; align-items: stretch; justify-content: center; gap: 18px; flex-wrap: wrap; }
.s-flow-i { width: 250px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 24px 18px; }
.s-flow-ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: var(--gold); color: var(--navy); }
.s-flow-ic .s-ic { width: 26px; height: 26px; }
.s-flow-i b { display: block; font-size: 20px; margin-bottom: 4px; }
.s-flow-i span { color: #c9d4e8; font-size: 14px; }
.s-arrow { font-size: 28px; color: var(--gold); align-self: center; }

/* Người dạy + lộ trình */
.s-teacher { display: grid; grid-template-columns: auto 1fr 360px; gap: 32px; align-items: center; }
.s-avatar { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(150deg, var(--navy-2), var(--navy)); display: grid; place-items: center; color: #fff; font-size: 54px; font-weight: 800; letter-spacing: -2px; overflow: hidden; border: 6px solid var(--cream); box-shadow: 0 0 0 1px #f6e3a6; }
.s-avatar span { color: var(--gold); }
.s-avatar img { width: 100%; height: 100%; object-fit: cover; }
.s-teacher p { font-size: 16.5px; color: #39425a; margin: 10px 0 14px; max-width: 520px; }
.s-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.s-chip { border: 1px solid var(--s-line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.s-chip small { color: var(--s-muted); font-weight: 500; margin-right: 4px; }
.s-route { display: block; background: var(--navy); color: #fff; border-radius: 22px; padding: 24px; transition: transform .15s; }
.s-route:hover { transform: translateY(-3px); }
.s-route b { display: block; font-size: 20px; margin: 4px 0 16px; }
.s-route-bars { display: grid; gap: 10px; }
.s-route-bars div { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #c9d4e8; }
.s-route-bars i { height: 10px; border-radius: 9px; background: linear-gradient(90deg, var(--gold), #ffd75e); min-width: 30px; }
.s-route-go { display: inline-block; margin-top: 16px; color: var(--gold); font-weight: 700; }

/* Hướng dẫn */
.s-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.s-step { background: #fff; border: 1px solid var(--s-line); border-radius: 20px; padding: 26px 20px; text-align: center; position: relative; }
.s-step-n { position: absolute; top: 14px; left: 16px; font-size: 13px; font-weight: 800; color: var(--gold-2); }
.s-step-ic { width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--cream); color: var(--navy); border: 1px solid #f6e3a6; }
.s-step-ic .s-ic { width: 28px; height: 28px; }
.s-step b { display: block; font-size: 17px; margin-bottom: 4px; }
.s-step span { font-size: 14px; color: var(--s-muted); }
.s-faq { max-width: 780px; margin: 48px auto 0; }
.s-faq details { border-bottom: 1px solid var(--s-line); padding: 16px 0; }
.s-faq summary { cursor: pointer; font-weight: 600; font-size: 16px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.s-faq summary::-webkit-details-marker { display: none; }
.s-faq summary::after { content: "+"; color: var(--gold-2); font-size: 22px; line-height: 1; }
.s-faq details[open] summary::after { content: "–"; }
.s-faq details p { color: var(--s-muted); margin: 10px 0 0; }

/* Đăng ký */
.s-reg { background: radial-gradient(700px 360px at 10% 0%, #2b4c86 0%, transparent 60%), linear-gradient(160deg, var(--navy), var(--navy-3)); color: #fff; padding: 88px 0; }
.s-reg-in { display: grid; grid-template-columns: 1fr 460px; gap: 48px; align-items: center; }
.s-reg h2 { color: #fff; margin: 16px 0 22px; }
.s-gifts { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 12px; }
.s-gifts li { display: flex; gap: 10px; font-size: 17px; }
.s-gifts .s-ic { color: var(--gold); }
.s-urgent { display: flex; gap: 10px; align-items: center; background: rgba(242,183,5,.12); border: 1px solid rgba(242,183,5,.35); border-radius: 14px; padding: 12px 16px; color: #ffe08a; }
.s-urgent b { color: #fff; }
.s-form { background: #fff; color: var(--s-ink); border-radius: 22px; padding: 26px; box-shadow: 0 30px 60px rgba(0,0,0,.25); display: grid; gap: 12px; }
.s-form h3 { margin: 0 0 4px; font-size: 20px; }

.s-form input:focus, .s-form select:focus { outline: 2px solid rgba(242,183,5,.6); border-color: var(--gold); }
.s-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-form-note { margin: 0; font-size: 12.5px; color: var(--s-muted); text-align: center; }

:"VID-03"},{"khoi":"TL-03","vai_tro":"luyen_tap"},{"khoi":"TL-05","vai_tro":"luyen_tap","bat_buoc":false}]}],"kiem_tra":{"ten":"Kiểm tra 15' – Bài 1","loai":"cuoi_buoi","thoi_gian_phut":15,"cach_tao":"ngau_nhien","so_lan_lam_toi_da":2,"hien_dap_an":"sau_khi_nop","ma_tran":[{"loai":"CAU_TN4","so_cau":3,"diem_moi_cau":1.0,"ky_nang":["9010101","9010102","9010103"],"muc_do":["NB","TH"]},{"loai":"CAU_DS","so_cau":1,"diem_moi_cau":4.0,"ky_nang":["9010102","9010103"]},{"loai":"CAU_TLN","so_cau":2,"diem_moi_cau":1.5,"ky_nang":["9010101","9010102"],"muc_do":["NB","TH"]}]},"btvn":[{"khoi":"TL-02","han":"buoi_sau"},{"khoi":"TL-04","han":"buoi_sau"},{"khoi":"TLN-03","han":"buoi_sau"}]},"noi_dung":{"nguon":{"ten":"Gói tự soạn 91001","nguon_goc":"thay_soan","quyen_su_dung":"cong_khai","xac_minh":"sympy"},"khoi":[{"id":"LT-01","loai":"LY_THUYET","ky_nang":"9010101","tieu_de":"Phương trình bậc nhất hai ẩn","noi_dung":"**Phương trình bậc nhất hai ẩn** $x, y$ là hệ thức dạng $ax + by = c$,\ntrong đó $a, b, c$ là các số đã biết và $a \\neq 0$ hoặc $b \\neq 0$.\n\nNếu $ax_0 + by_0 = c$ là khẳng định đúng thì cặp số $(x_0; y_0)$ là **một nghiệm** của phương trình.\n"},{"id":"LT-02","loai":"LY_THUYET","ky_nang":"9010102","tieu_de":"Tập nghiệm và đường thẳng biểu diễn","noi_dung":"Mỗi phương trình bậc nhất hai ẩn có **vô số nghiệm**. Trên mặt phẳng toạ độ, tập nghiệm\nlà một **đường thẳng** $ax + by = c$:\n\n- $a \\neq 0,\\ b \\neq 0$: đường thẳng $y = -\\dfrac{a}{b}x + \\dfrac{c}{b}$;\n- $a = 0,\\ b \\neq 0$: đường thẳng $y = \\dfrac{c}{b}$, song song (hoặc trùng) trục $Ox$;\n- $a \\neq 0,\\ b = 0$: đường thẳng $x = \\dfrac{c}{a}$, song song (hoặc trùng) trục $Oy$.\n"},{"id":"LT-03","loai":"LY_THUYET","ky_nang":"9010103","tieu_de":"Hệ hai phương trình bậc nhất hai ẩn","noi_dung":"Hệ hai phương trình bậc nhất hai ẩn có dạng\n$\\begin{cases} ax + by = c \\\\ a'x + b'y = c' \\end{cases}$\n\nCặp số $(x_0; y_0)$ là **nghiệm của hệ** nếu nó là nghiệm của **cả hai** phương trình.\nVề hình học, đó là toạ độ giao điểm của hai đường thẳng.\n"},{"id":"PP-01","loai":"PHUONG_PHAP","ky_nang":"9010101","tieu_de":"Dạng 1. Nhận biết phương trình bậc nhất hai ẩn; kiểm tra nghiệm","noi_dung":"1. Đưa hệ thức về dạng $ax + by = c$; kiểm tra **không** có $x^2$, $xy$, $\\dfrac{1}{x}$, …\n2. Kiểm tra điều kiện $a \\neq 0$ hoặc $b \\neq 0$.\n3. Kiểm tra nghiệm: thay $x = x_0,\\ y = y_0$ vào vế trái, so sánh với $c$.\n"},{"id":"PP-02","loai":"PHUONG_PHAP","ky_nang":"9010102","tieu_de":"Dạng 2. Viết nghiệm tổng quát và vẽ đường thẳng nghiệm","noi_dung":"1. Nếu $b \\neq 0$: rút $y = \\dfrac{c - ax}{b}$, nghiệm tổng quát $\\left(x; \\dfrac{c-ax}{b}\\right)$, $x \\in \\mathbb{R}$.\n2. Nếu $b = 0$: nghiệm $\\left(\\dfrac{c}{a}; y\\right)$, $y \\in \\mathbb{R}$.\n3. Vẽ: lấy hai điểm dễ tính (thường là giao với hai trục) rồi nối.\n"},{"id":"PP-03","loai":"PHUONG_PHAP","ky_nang":"9010103","tieu_de":"Dạng 3. Kiểm tra một cặp số có là nghiệm của hệ","noi_dung":"Thay cặp số vào **từng** phương trình. Chỉ khi thoả mãn cả hai mới là nghiệm của hệ.\nMẹo: thử phương trình dễ trước — sai ở phương trình nào thì loại ngay.\n"},{"id":"VD-01","loai":"VI_DU","ky_nang":"9010101","muc_do":"NB","de":"Trong các hệ thức $2x - 5y = 3$; $\\ 0x + 3y = 6$; $\\ x^2 + y = 1$; $\\ 0x + 0y = 2$,\nhệ thức nào là phương trình bậc nhất hai ẩn?\n","loi_giai":["$2x - 5y = 3$ có $a = 2 \\neq 0$: là phương trình bậc nhất hai ẩn.","$0x + 3y = 6$ có $b = 3 \\neq 0$: là phương trình bậc nhất hai ẩn.","$x^2 + y = 1$ chứa $x^2$: không phải.","$0x + 0y = 2$ có $a = b = 0$: không phải."],"dap_an":"$2x - 5y = 3$ và $0x + 3y = 6$"},{"id":"VD-02","loai":"VI_DU","ky_nang":"9010101","muc_do":"NB","de":"Cặp số nào là nghiệm của phương trình $3x + 2y = -1$: $(1; -2)$ hay $(2; 1)$?\n","loi_giai":["Với $(1;-2)$: $3 \\cdot 1 + 2 \\cdot (-2) = -1$ đúng.","Với $(2;1)$: $3 \\cdot 2 + 2 \\cdot 1 = 8 \\neq -1$."],"dap_an":"$(1; -2)$"},{"id":"VD-03","loai":"VI_DU","ky_nang":"9010102","muc_do":"TH","de":"Viết nghiệm tổng quát của phương trình $2x - y = 4$ và vẽ đường thẳng biểu diễn tập nghiệm.\n","loi_giai":["Rút $y = 2x - 4$. Nghiệm tổng quát: $(x; 2x - 4)$ với $x \\in \\mathbb{R}$.","Cho $x = 0 \\Rightarrow y = -4$: điểm $A(0; -4)$. Cho $y = 0 \\Rightarrow x = 2$: điểm $B(2; 0)$.","Đường thẳng $AB$ là đường thẳng $2x - y = 4$."],"dap_an":"$(x; 2x-4),\\ x \\in \\mathbb{R}$"},{"id":"VD-04","loai":"VI_DU","ky_nang":"9010103","muc_do":"TH","de":"Cho hệ $\\begin{cases} x + y = 5 \\\\ 2x - y = 1 \\end{cases}$.\nCặp số $(2; 3)$ và $(3; 2)$, cặp nào là nghiệm của hệ?\n","loi_giai":["Với $(2;3)$: $2 + 3 = 5$ đúng; $2 \\cdot 2 - 3 = 1$ đúng ⇒ là nghiệm của hệ.","Với $(3;2)$: $3 + 2 = 5$ đúng; $2 \\cdot 3 - 2 = 4 \\neq 1$ ⇒ không là nghiệm."],"dap_an":"$(2; 3)$"},{"id":"TL-01","loai":"BAI_TL","ky_nang":"9010101","muc_do":"TH","thoi_gian":120,"de":"Tìm $m$ để cặp số $(2; -1)$ là nghiệm của phương trình $mx + 3y = 5$.","loi_giai":[{"noi_dung":"Thay $x = 2,\\ y = -1$: $2m - 3 = 5$.","diem":0.5},{"noi_dung":"$\\Rightarrow m = 4$.","diem":0.5}],"dap_an":{"gia_tri":"4","kieu":"so"}},{"id":"TL-02","loai":"BAI_TL","ky_nang":"9010102","muc_do":"TH","thoi_gian":240,"de":"Viết nghiệm tổng quát và vẽ đường thẳng biểu diễn tập nghiệm của mỗi phương trình:\na) $x - 3y = 6$; $\\quad$ b) $0x + 2y = 4$; $\\quad$ c) $3x + 0y = -6$.\n","loi_giai":[{"noi_dung":"a) $y = \\dfrac{x - 6}{3}$, nghiệm $\\left(x; \\dfrac{x-6}{3}\\right)$, $x\\in\\mathbb{R}$; đường thẳng qua $(0;-2)$ và $(6;0)$.","diem":0.5},{"noi_dung":"b) $y = 2$, nghiệm $(x; 2)$, $x\\in\\mathbb{R}$; đường thẳng song song $Ox$.","diem":0.25},{"noi_dung":"c) $x = -2$, nghiệm $(-2; y)$, $y\\in\\mathbb{R}$; đường thẳng song song $Oy$.","diem":0.25}]},{"id":"TL-03","loai":"BAI_TL","ky_nang":"9010103","muc_do":"TH","thoi_gian":150,"de":"Trong các cặp số $(3; 1)$, $(2; 3)$, $(-1; 9)$, cặp nào là nghiệm của hệ\n$\\begin{cases} 2x + y = 7 \\\\ x - 3y = -7 \\end{cases}$?\n","loi_giai":[{"noi_dung":"$(3;1)$: $2\\cdot3+1=7$ đúng; $3-3\\cdot1=0\\neq-7$ ⇒ loại.","diem":0.25},{"noi_dung":"$(2;3)$: $2\\cdot2+3=7$ đúng; $2-3\\cdot3=-7$ đúng ⇒ là nghiệm.","diem":0.5},{"noi_dung":"$(-1;9)$: $-2+9=7$ đúng; $-1-27=-28\\neq-7$ ⇒ loại.","diem":0.25}],"dap_an":{"gia_tri":"(2; 3)","kieu":"cap_so"}},{"id":"TL-04","loai":"BAI_TL","ky_nang":"9010101","muc_do":"VD","thoi_gian":300,"boi_canh":"thuc_te","de":"Vé xem xiếc giá 50 nghìn đồng/vé người lớn và 30 nghìn đồng/vé trẻ em.\nMột nhóm mua hết đúng 400 nghìn đồng. Gọi $x, y$ là số vé người lớn, trẻ em.\na) Viết phương trình liên hệ $x, y$. b) Liệt kê mọi khả năng $(x; y)$ với $x, y$ là số tự nhiên.\n","loi_giai":[{"noi_dung":"a) $50x + 30y = 400 \\Leftrightarrow 5x + 3y = 40$.","diem":0.25},{"noi_dung":"b) $3y = 40 - 5x$ chia hết cho $3$ và $\\geq 0$ ⇒ $x \\in \\{2; 5; 8\\}$.","diem":0.5},{"noi_dung":"Các khả năng: $(2;10)$, $(5;5)$, $(8;0)$.","diem":0.25}],"dap_an":{"gia_tri":"(2;10),(5;5),(8;0)","kieu":"van_ban"}},{"id":"TL-05","loai":"BAI_TL","ky_nang":"9010103","muc_do":"VD","thoi_gian":180,"de":"Tìm $a, b$ để hệ $\\begin{cases} ax + y = 5 \\\\ x + by = 4 \\end{cases}$ nhận $(1; 2)$ làm nghiệm.\n","loi_giai":[{"noi_dung":"Thay vào phương trình thứ nhất: $a + 2 = 5 \\Rightarrow a = 3$.","diem":0.5},{"noi_dung":"Thay vào phương trình thứ hai: $1 + 2b = 4 \\Rightarrow b = \\dfrac{3}{2}$.","diem":0.5}],"dap_an":{"gia_tri":"a=3; b=3/2","kieu":"van_ban"}},{"id":"TN-01","loai":"CAU_TN4","ky_nang":"9010101","muc_do":"NB","thoi_gian":45,"de":"Phương trình nào sau đây là phương trình bậc nhất hai ẩn?","lua_chon":{"A":{"noi_dung":"$x^2 + y = 2$","loi_sai":"Có $x^2$ nên không bậc nhất."},"B":{"noi_dung":"$0x + 0y = 1$","loi_sai":"Quên điều kiện $a \\neq 0$ hoặc $b \\neq 0$."},"C":{"noi_dung":"$3x - 0y = 5$"},"D":{"noi_dung":"$xy = 1$","loi_sai":"Tích $xy$ không phải dạng $ax + by$."}},"dap_an":"C","loi_giai":["$3x - 0y = 5$ có $a = 3 \\neq 0$ nên là phương trình bậc nhất hai ẩn."]},{"id":"TN-02","loai":"CAU_TN4","ky_nang":"9010101","muc_do":"NB","thoi_gian":45,"de":"Cặp số nào là nghiệm của phương trình $2x -   function inl(s) {

  function md(s) {

      });
    });
    pane.innerHTML = h + `<p class="small muted">Lời giải lưu theo từng bước (bảng <code>khoi_buoc</code>): em thử tự làm trước, rồi mở dần từng bước.</p>`;
    pane.querySelectorAll("[data-vd]").forEach((c) => {
      const btn = c.querySelector("[data-mo]"), li = [...c.querySelectorAll("li")];
      btn.onclick = () => {
        const i = li.findIndex((x) => x.classList.contains("hide"));
        if (i >= 0) li[i].classList.remove("hide");
        const con = li.filter((x) => x.classList.contains("hide")).length;
        btn.textContent = con ? `Hiện bước tiếp theo (${li.length - con}/${li.length})` : "Đã hiện hết lời giải";
        if (!con) { btn.disabled = true; const d = c.querySelector(".hide-da"); if (d) d.style.display = "block"; }
      };
    });
    pane.querySelectorAll("[data-vid]").forEach((x) => (x.onclick = () => diBuoc(ma, "video", x.dataset.vid)));
  }

  function pVideo(pane, g) {
    const vs = g.noi_dung.video || [];
    const v = vs.find((x) => x.id === videoChon) || vs[0];
    let i = 0;
    const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    pane.innerHTML = `<div class="tabs" style="margin-top:0">${vs.map((x) => `<button data-v="${x.id}" class="${x.id === v.id ? "on" : ""}">${esc(x.tieu_de.split("–")[0])}</button>`).join("")}</div>
      <div class="card"><h3 style="margin-top:0">${esc(v.tieu_de)}</h3>
      <div class="row small muted">Mã video <code>${v.ma}</code> · dự kiến ${fmt(v.thoi_luong_du_kien)} · dạng: ${v.ky_nang.map((m) => esc(knTen(m))).join(", ")}</div>
      <div class="video" style="margin-top:10px">
        <div class="screen" id="scr"></div>
        <div class="chap" id="chap">${v.kich_ban.map((m, j) => `<button data-c="${j}">${fmt(m.giay)} · ${esc(m.tieu_de)}</button>`).join("")}
          <button class="btn gold" id="play">▶ Phát mô phỏng</button></div>
      </div>
      <p class="small muted">Bản demo chưa có video thật: màn hình hiển thị <b>kịch bản</b> từng mốc chương. Khi quay xong, khung này nhúng trình phát YouTube (không công khai) hoặc Bunny Stream theo <code>video.ma_ngoai</code> (ADR-0008); các mốc chương dùng lại y nguyên.</p></div>`;
    const show = (j) => {
      if (!$("#scr")) { clearInterval(window.__play); return; }
      i = j; const m = v.kich_ban[j];
      $("#scr").innerHTML = `<div><div class="small">Chương ${j + 1}/${v.kich_ban.length}</div><div class="now">${esc(m.tieu_de)}</div><p>${esc(m.loi)}</p></div><span class="tm">${fmt(m.giay)} / ${fmt(v.thoi_luong_du_kien)}</span>`;
      pane.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", +b.dataset.c === j));
    };
    show(0);
    pane.querySelectorAll("[data-c]").forEach((b) => (b.onclick = () => { clearInterval(window.__play); show(+b.dataset.c); }));
    pane.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { clearInterval(window.__play); videoChon = b.dataset.v; pVideo(pane, g); typeset(pane); }));
    $("#play").onclick = () => { clearInterval(window.__play); show(0); window.__play = setInterval(() => { if (i + 1 >= v.kich_ban.length) clearInterval(window.__play); else show(i + 1); }, 2500); };
  }

  // ------------------------------------------------------------ câu hỏi (luyện tập: chấm ngay; kiểm tra: thu đáp án)
  function qHTML(k, idx, mode, thuTu) {
    const top = `<div class="hd">${idx ? `<b>Câu ${idx}.</b>` : ""}${chip(LOAI_CAU[k.loai] || k.loai)}${k.muc_do ? chip(k.muc_do) : ""}<span class="small muted">${esc(knTen(k.ky_nang))}</span></div>${md(k.de)}`;
    if (k.loai === "CAU_TN4") {
      const ord = thuTu || ["A", "B", "C", "D"];
      return top + `<div class="opts">${ord.map((goc, j) => `<button class="opt" data-o="${goc}"><b>${"ABCD"[j]}.</b><span>${inl(k.lua_chon[goc].noi_dung)}</span></button>`).join("")}</div>` + (mode === "lt" ? `<div class="fbx"></div>` : "");
    }
    if (k.loai === "CAU_DS") {
      return top + `<table class="ds">${k.y.map((y) => `<tr data-y="${y.nhan}"><td><b>${y.nhan})</b> ${inl(y.menh_de)}</td><td class="c"><button data-v="Đ">Đúng</button><button data-v="S">Sai</button></td></tr>`).join("")}</table>`
        + (mode === "lt" ? `<div class="row" style="margin-top:8px"><button class="btn pri" data-kiem>Kiểm tra</button></div><div class="fbx"></div>` : "");
    }
    if (k.loai === "CAU_TLN") {
      return top + `<div class="tln"><input placeholder="Đáp số" inputmode="decimal">${mode === "lt" ? '<button class="btn pri" data-kiem>Kiểm tra</button>' : ""}</div>` + (mode === "lt" ? `<div class="fbx"></div>` : "");
    }
    // tự luận
    const bs = buocList(k);
    return top + `<div class="row" style="margin-top:8px"><button class="btn" data-mo>Em đã làm vào vở – xem thang điểm</button></div>
      <div class="sol" style="display:none"><ol>${bs.map((b) => `<li>${inl(b.noi_dung)}${b.diem != null ? ` ${chip(b.diem + "đ", "gold")}` : ""}</li>`).join("")}</ol>
      <div class="row" style="margin-top:6px"><span class="small">Em tự chấm:</span><button class="btn" data-tu="1">Làm đúng</button><button class="btn" data-tu="0.5">Đúng một phần</button><button class="btn" data-tu="0">Chưa đúng</button></div><div class="fbx"></div></div>`;
  }
  const loiGiai = (k) => buocList(k).length ? `<div class="small" style="margin-top:6px">${buocList(k).map((b) => inl(b.noi_dung)).join("<br>")}</div>` : "";

  function ganLuyen(el, k, ma, ctx) {
    const fb = (ok, html) => { const f = el.querySelector(".fbx"); f.innerHTML = `<div class="fb ${ok ? "ok" : "bad"}">${html}</div>`; typeset(f); };
    const ghi = (diem) => { const st = sb(ma); if (st.lt[ctx + k.id] == null) { st.lt[ctx + k.id] = diem; ghiKn(k.ky_nang, diem, 1); } };
    if (k.loai === "CAU_TN4") {
      el.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
        const o = b.dataset.o, ok = o === k.dap_an;
        el.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel", "right", "wrong"));
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) el.querySelector(`[data-o="${k.dap_an}"]`).classList.add("right");
        ghi(ok ? 1 : 0);
        fb(ok, ok ? "Chính xác! " + loiGiai(k) : `Chưa đúng. ${k.lua_chon[o].loi_sai ? "<b>Lỗi hay gặp:</b> " + inl(k.lua_chon[o].loi_sai) : ""}${loiGiai(k)}`);
      }));
    } else if (k.loai === "CAU_DS") {
      dsChon(el);
      el.querySelector("[data-kiem]").onclick = () => {
        let n = 0;
        k.y.forEach((y) => { const tr = el.querySelector(`[data-y="${y.nhan}"]`), v = tr.dataset.v, ok = (v === "Đ") === y.dung && v; tr.classList.toggle("right", !!ok); tr.classList.toggle("wrong", !ok); if (ok) n++; });
        ghi(THANG_DS[n]);
        fb(n === 4, `Đúng ${n}/4 ý → được ${THANG_DS[n] * 100}% điểm câu. Đáp án: ${k.y.map((y) => y.nhan + ") " + (y.dung ? "Đúng" : "Sai")).join(", ")}.`);
      };
    } else if (k.loai === "CAU_TLN") {
      el.querySelector("[data-kiem]").onclick = () => {
        const v = el.querySelector("input").value, ok = chamTLN(k, v);
        ghi(ok ? 1 : 0);
        fb(ok, ok ? "Chính xác! " + loiGiai(k) : `Chưa đúng. Đáp số: <b>${esc(k.dap_an.gia_tri)}</b>.${loiGiai(k)}`);
      };
    } else {
      el.querySelector("[data-mo]").onclick = () => { el.querySelector(".sol").style.display = "block"; typeset(el); };
      el.querySelectorAll("[data-tu]").forEach((b) => (b.onclick = () => { ghi(+b.dataset.tu); fb(+b.dataset.tu === 1, "Đã ghi nhận. Bài tự luận ở web thật sẽ do thầy chấm theo thang điểm từng bước."); }));
    }
  }
  function dsChon(el) {
    el.querySelectorAll("[data-y] button").forEach((b) => (b.onclick = () => {
      const tr = b.closest("tr"); tr.dataset.v = b.dataset.v;
      tr.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b));
    }));
  }
  function chamTLN(k, v) {
    const a = so(k.dap_an.gia_tri), b = so(v);
    if (!isNaN(a) && !isNaN(b)) return Math.abs(a - b) <= (k.dap_an.sai_so || 0) + 1e-9;
    return String(v).replace(/\s/g, "") === String(k.dap_an.gia_tri).replace(/\s/g, "");
  }

  function pLuyenTap(pane, g, ma) {
    const K = khoiMap(g); let h = "";
    phanDang(g).forEach((p) => {
      const ds = vaiTro(p, "luyen_tap"); if (!ds.length) return;
      h += `<h2>${esc(p.ten)}</h2>` + ds.map((x) => `<div class="q" data-k="${x.khoi}">${x.bat_buoc === false ? chip("Mở rộng – học sinh khá", "star") : ""}${qHTML(K[x.khoi], 0, "lt")}</div>`).join("");
    });
    pane.innerHTML = `<div class="banner">Luyện tập xếp từ dễ đến khó trong từng dạng. Câu trắc nghiệm, Đúng/Sai, trả lời ngắn được chấm ngay; tự luận em làm vào vở rồi đối chiếu thang điểm.</div>` + h;
    pane.querySelectorAll("[data-k]").forEach((el) => ganLuyen(el, K[el.dataset.k], ma, "lt:"));
  }

  function pBtvn(pane, g, ma) {
    const K = khoiMap(g), st = sb(ma);
    pane.innerHTML = `<div class="banner">Bài tập về nhà – hạn: buổi học sau. ${st.btvnNop ? chip("Đã nộp", "ok") : ""}</div>` +
      g.buoi.btvn.map((x) => `<div class="q" data-k="${x.khoi}">${qHTML(K[x.khoi], 0, "lt")}</div>`).join("") +
      `<div class="row" style="margin-top:12px"><button class="btn pri" id="nop">${st.btvnNop ? "Nộp lại" : "Nộp bài tập về nhà"}</button><span class="small muted">Web thật: học sinh chụp bài tự luận, thầy chấm theo thang điểm từng bước.</span></div>`;
    pane.querySelectorAll("[data-k]").forEach((el) => ganLuyen(el, K[el.dataset.k], ma, "btvn:"));
    $("#nop").onclick = () => { st.btvnNop = true; st.buoc.btvn = true; save(); viewBuoi(ma); typeset(app); };
  }

  // ------------------------------------------------------------ KIỂM TRA NGẮN (bốc đề theo ma trận)
  function khoCau(g, dong) {
    const daDung = new Set(g.buoi.phan.flatMap((p) => p.noi_dung).filter((x) => ["luyen_tap", "btvn"].includes(x.vai_tro)).map((x) => x.khoi)
      .concat(g.buoi.btvn.map((x) => x.khoi)));
    return g.noi_dung.khoi.filter((k) => k.loai === dong.loai && dong.ky_nang.includes(k.ky_nang)
      && (!dong.muc_do || dong.muc_do.includes(k.muc_do)) && !daDung.has(k.id));
  }
  function pKiemTra(pane, g, ma) {
    const kt = g.buoi.kiem_tra, st = sb(ma), conLan = (kt.so_lan_lam_toi_da || 99) - st.kt.length;
    pane.innerHTML = `<div class="card"><h3 style="margin-top:0">${esc(kt.ten)}</h3>
      <p>${kt.thoi_gian_phut} phút · tối đa ${kt.so_lan_lam_toi_da} lần · đáp án hiện sau khi nộp. Mỗi lượt làm, máy <b>bốc một đề khác</b> theo ma trận, không lấy câu em đã gặp ở luyện tập/BTVN.</p>
      <table class="tb"><tr><th>Dạng câu</th><th>Kỹ năng</th><th>Mức độ</th><th>Số câu</th><th>Điểm/câu</th><th>Kho câu</th></tr>
      ${kt.ma_tran.map((d) => `<tr><td>${LOAI_CAU[d.loai]}</td><td>${d.ky_nang.join(", ")}</td><td>${(d.muc_do || ["mọi mức"]).join(", ")}</td><td>${d.so_cau}</td><td>${d.diem_moi_cau}</td><td>${khoCau(g, d).length}</td></tr>`).join("")}
      </table>
      ${st.kt.length ? `<p>Các lần đã làm: ${st.kt.map((x, i) => chip(`Lần ${i + 1}: ${x.diem.toFixed(1)}đ`, x.diem >= 5 ? "ok" : "bad")).join(" ")}</p>` : ""}
      <div class="row"><button class="btn pri" id="bd" ${conLan > 0 ? "" : "disabled"}>${conLan > 0 ? `Bắt đầu làm bài (còn ${conLan} lần)` : "Đã hết lượt làm"}</button>
      <span class="small muted">Thang Đúng/Sai: đúng 1/2/3/4 ý được 10/25/50/100% điểm câu.</span></div></div>`;
    if (conLan > 0) $("#bd").onclick = () => batDau(pane, g, ma);
  }
  function batDau(pane, g, ma) {
    const kt = g.buoi.kiem_tra, hat = Date.now() % 2147483647, r = rng(hat);
    const de = [];
    kt.ma_tran.forEach((d) => tron(khoCau(g, d), r).slice(0, d.so_cau).forEach((k) => de.push({ k, diem: d.diem_moi_cau, ord: k.loai === "CAU_TN4" ? tron(["A", "B", "C", "D"], r) : null })));
    let con = kt.thoi_gian_phut * 60;
    pane.innerHTML = `<div class="card row" style="justify-content:space-between;position:sticky;top:62px;z-index:5">
        <span>Mã đề <code>${hat.toString(36).toUpperCase()}</code> · ${de.length} câu · 10 điểm</span><span class="timer" id="tm"></span></div>
      ${de.map((c, i) => `<div class="q" data-i="${i}">${qHTML(c.k, i + 1, "kt", c.ord)}</div>`).join("")}
      <div class="row" style="margin-top:12px"><button class="btn pri" id="nop">Nộp bài</button></div>`;
    pane.querySelectorAll(".q").forEach((el) => {
      el.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { el.querySelectorAll(".opt").forEach((x) => x.classList.toggle("sel", x === b)); el.dataset.tl = b.dataset.o; }));
      dsChon(el);
    });
    const tick = () => { if (!$("#tm")) { clearInterval(window.__timer); return; } $("#tm").textContent = `${Math.floor(con / 60)}:${String(con % 60).padStart(2, "0")}`; if (con-- <= 0) nop(); };
    tick(); window.__timer = setInterval(tick, 1000);
    const nop = () => {
      clearInterval(window.__timer);
      let tong = 0; const theoKn = {};
      const kq = de.map((c, i) => {
        const el = pane.querySelector(`[data-i="${i}"]`), k = c.k; let ty = 0, tl = "";
        if (k.loai === "CAU_TN4") { tl = el.dataset.tl || ""; ty = tl === k.dap_an ? 1 : 0; }
        if (k.loai === "CAU_DS") { const n = k.y.filter((y) => { const v = el.querySelector(`[data-y="${y.nhan}"]`).dataset.v; return v && (v === "Đ") === y.dung; }).length; ty = THANG_DS[n]; tl = n + "/4 ý đúng"; }
        if (k.loai === "CAU_TLN") { tl = el.querySelector("input").value; ty = chamTLN(k, tl) ? 1 : 0; }
        const d = c.diem * ty; tong += d;
        (theoKn[k.ky_nang] = theoKn[k.ky_nang] || [0, 0]); theoKn[k.ky_nang][0] += ty; theoKn[k.ky_nang][1] += 1;
        return { c, d, ty, tl };
      });
      Object.entries(theoKn).forEach(([m, [a, b]]) => ghiKn(m, a, b));
      const st = sb(ma); st.kt.push({ diem: tong, ngay: new Date().toISOString(), ma_de: hat }); st.buoc.kiem_tra = true; save();
      const yeu = Object.entries(theoKn).filter(([, [a, b]]) => a / b < 0.6).map(([m]) => m);
      const V = (g.noi_dung.video || []);
      pane.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small muted">Kết quả</div><div class="score" style="color:${tong >= 5 ? "var(--ok)" : "var(--bad)"}">${tong.toFixed(2).replace(/\.?0+$/, "")}<span style="font-size:18px">/10</span></div></div>
        <div class="skills" style="min-width:260px">${Object.entries(theoKn).map(([m, [a, b]]) => `<div class="small">${esc(knTen(m))}<div class="bar"><i style="width:${(100 * a) / b}%;background:${a / b >= 0.6 ? "var(--ok)" : "var(--bad)"}"></i></div></div>`).join("")}</div></div>
        ${yeu.length ? `<div class="fb bad">Dạng cần ôn lại: ${yeu.map((m) => { const v = V.find((x) => x.ky_nang.includes(m)); return esc(knTen(m)) + (v ? ` — <a href="#" data-vid="${v.id}">xem video</a>` : ""); }).join("; ")}</div>` : `<div class="fb ok">Em đã nắm được các dạng của buổi này. Buổi đã được tính hoàn thành trên lộ trình.</div>`}
        <div class="row" style="margin-top:8px"><a class="btn" href="#lo-trinh">Về lộ trình</a><button class="btn" id="lai">Xem thông tin bài kiểm tra</button></div></div>
        <h2>Đáp án và lời giải</h2>
        ${kq.map(({ c, d, tl }, i) => { const k = c.k; const da = k.loai === "CAU_TN4" ? `Đáp án đúng: <b>${"ABCD"[c.ord.indexOf(k.dap_an)]}</b>` : k.loai === "CAU_DS" ? "Đáp án: " + k.y.map((y) => y.nhan + ") " + (y.dung ? "Đ" : "S")).join(" ") : `Đáp số: <b>${esc(k.dap_an.gia_tri)}</b>`;
          const em = k.loai === "CAU_TN4" ? (tl ? "ABCD"[c.ord.indexOf(tl)] : "bỏ trống") : esc(tl || "bỏ trống");
          return `<div class="q"><div class="hd"><b>Câu ${i + 1}.</b>${chip(LOAI_CAU[k.loai])}${chip(`${+d.toFixed(2)}/${c.diem}đ`, d === c.diem ? "ok" : d > 0 ? "gold" : "bad")}</div>${md(k.de)}<div class="small">Em trả lời: ${em} · ${da}</div>${loiGiai(k)}</div>`; }).join("")}`;
      pane.querySelectorAll("[data-vid]").forEach((x) => (x.onclick = (e) => { e.preventDefault(); diBuoc(ma, "video", x.dataset.vid); }));
      $("#lai").onclick = () => { pKiemTra(pane, g, ma); typeset(pane); };
      typeset(pane);
    };
    $("#nop").onclick = nop;
  }

  // ------------------------------------------------------------ KỸ NĂNG CỦA EM
  function viewKyNang() {
    const byC = {};
    Object.entries(D.ky_nang).forEach(([m, k]) => (byC[k.chuong] = byC[k.chuong] || []).push([m, k]));
    const LA = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
    app.innerHTML = `<h1>Kỹ năng của em</h1><p class="muted">Mức thành thạo tính từ câu luyện tập và kiểm tra em đã làm (web thật: bảng <code>thanh_thao</code>). Dạng còn hổng sẽ được gợi ý ôn trước buổi cần nó.</p>` +
      Object.entries(byC).map(([c, ds]) => {
        const hoc = ds.filter(([m]) => thanhThao(m) != null).length;
        return `<h2>Chương ${LA[c]}. ${esc(D.chuong[c])} <span class="small muted">· ${hoc}/${ds.length} kỹ năng đã có dữ liệu</span></h2><div class="card skills">${ds.map(([m, k]) => {
          const v = thanhThao(m), [t, cl] = mucTT(v);
          return `<div class="sk"><code>${m}</code><span>${esc(k.ten)} ${k.pham_vi === "mo_rong" ? chip("⭐ thi 10", "star") : ""}</span><span class="row">${chip(t, cl)}${v != null ? `<span class="small muted">${Math.round(v * 100)}%</span>` : ""}</span></div>`;
        }).join("")}</div>`;
      }).join("");
  }

  // ------------------------------------------------------------ GÓC GIÁO VIÊN: tiến độ sản xuất nội dung
  function sanSang(b) {
    const g = D.goi[b.ma];
    if (!g) return null;
    const all = g.buoi.phan.flatMap((p) => p.noi_dung), K = khoiMap(g);
    const dangOk = phanDang(g).every((p) => vaiTro(p, "bai_giang").length && vaiTro(p, "vi_du").length && p.noi_dung.some((x) => x.video));
    const lt = all.filter((x) => x.vai_tro === "luyen_tap").map((x) => K[x.khoi]);
    const ktOk = (g.buoi.kiem_tra?.ma_tran || []).every((d) => khoCau(g, d).length >= d.so_cau);

      Object.entries(tr).forEach(([k, entry]) => { if (entry) body.append(entry, f[k] || ""); });
      try { await fetch(dk.google_form_action, { method: "POST", mode: "no-cors", body }); } catch (err) { /* no-cors không đọc được phản hồi */ }
      form.innerHTML = `<div class="s-done">${ic("check")}<h3>Đăng ký thành công!</h3><p>Cảm ơn phụ huynh. ${esc(C.giao_vien)} sẽ liên hệ qua số <b>${esc(f.sdt)}</b> để gửi tài liệu và tư vấn lộ trình.</p><a class="s-btn navy" href="#buoi-91001">Học thử ngay</a></div>`;
      return;
    }
    const noiDung = `Đăng ký ${C.thuong_hieu}: ${f.ho_ten} – ${f.lop} – học lực: ${f.hoc_luc} – mục tiêu: ${f.muc_tieu} – SĐT phụ huynh: ${f.sdt}`;
    msg.hidden = false; msg.className = "s-form-msg";
    msg.innerHTML = L.zalo
      ? `Gửi thông tin cho thầy qua Zalo để hoàn tất: <b>${esc(L.zalo)}</b><br><button type="button" class="s-btn line sm" id="s-copy">Sao chép nội dung đăng ký</button>`
      : `<b>Bản xem thử:</b> website chưa kết nối nơi nhận đăng ký (Google Form) nên thông tin chưa được gửi đi. Thầy điền mục <code>dang_ky</code> trong <code>website/cau-hinh.yaml</code>.`;
    const nut = $("#s-copy");
    if (nut) nut.onclick = () => navigator.clipboard.writeText(noiDung).then(() => (nut.textContent = "Đã sao chép ✓"), () => (nut.textContent = noiDung));
  });

  // ------------------------------------------------------------------ định tuyến
  const home = $("#home"), shell = $("#s-app-shell"), sticky = $("#s-sticky");
  function dinhTuyen() {
    const h = location.hash.slice(1) || "trang-chu";
    $("#s-nav").classList.remove("open");
    if (window.TV9.laApp(h)) {
      home.hidden = true; shell.hidden = false; sticky.hidden = true;
      window.TV9.route();
      document.querySelectorAll(".s-subnav a").forEach((a) => a.classList.toggle("on", h.startsWith(a.dataset.sub) || (a.dataset.sub === "lo-trinh" && h.startsWith("buoi-"))));
      document.title = `Lộ trình học · ${C.thuong_hieu}`;
      dat("lo-trinh");
    } else {
      shell.hidden = true; home.hidden = false; sticky.hidden = h === "dang-ky";
      const muc = HOME.includes(h) ? h : "trang-chu";
      dat(muc);
      document.title = `${C.thuong_hieu} – ${C.giao_vien} · ${C.chuyen_mon}`;
      if (muc === "trang-chu") window.scrollTo(0, 0);
      else requestAnimationFrame(() => document.getElementById(muc).scrollIntoView());
    }
  }
  function dat(muc) { document.querySelectorAll(".s-nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === muc)); }
  $("#s-burger").onclick = () => $("#s-nav").classList.toggle("open");
  $("#xoa-tien-do").onclick = () => window.TV9.xoaTienDo();
  window.addEventListener("hashchange", dinhTuyen);
  dinhTuyen();
})();

</script>
</body>
</html>
