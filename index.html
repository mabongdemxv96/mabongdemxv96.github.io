<style>:root {
  --ink: #1d2433; --muted: #5b6475; --line: #e3e6ec; --bg: #f6f7f9; --card: #fff;
  --gold: #e9a908; --gold-soft: #fff6dc; --blue: #1f5fa8; --blue-soft: #e8f0fa;
  --ds: #1f5fa8; --hh: #18875a; --tk: #7a4bc2; --th: #6b7280;
  --ok: #18875a; --ok-soft: #e6f5ee; --bad: #c2410c; --bad-soft: #fdecdf;
  --r: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
code { font-size: .9em; background: #eef0f4; padding: 1px 5px; border-radius: 4px; }

button { font: inherit; cursor: pointer; }
.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.logo { background: var(--gold); color: #fff; font-weight: 800; border-radius: 8px; padding: 6px 8px; font-size: 13px; letter-spacing: .5px; }

main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.foot { max-width: 1100px; margin: 0 auto 30px; padding: 0 20px; color: var(--muted); font-size: 13px; }
.link { background: none; border: 0; color: var(--blue); padding: 0; text-decoration: underline; }

.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.grid { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef0f4; color: var(--muted); white-space: nowrap; }
.chip.DS { background: #e8f0fa; color: var(--ds); } .chip.HH { background: #e6f5ee; color: var(--hh); }
.chip.TK { background: #f1ebfa; color: var(--tk); } .chip.TH { background: #f0f1f3; color: var(--th); }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; }

.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }

/* Lộ trình */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-bottom: 8px; }
.next { border-left: 4px solid var(--gold); }
.tabs { display: flex; gap: 6px; margin: 18px 0 10px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
.tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.week { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
.week:first-child { border-top: 0; }
.wk { font-weight: 700; color: var(--muted); font-size: 13px; padding-top: 10px; }
.sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ses { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); position: relative; }

/* Buổi học */

.layout { display: grid; grid-template-columns: 230px 1fr; gap: 18px; align-items: start; margin-top: 14px; }

.steps button.on { background: var(--card); border-color: var(--line); font-weight: 600; }
.steps .n { width: 22px; height: 22px; border-radius: 50%; background: #e7eaf0; display: inline-grid; place-items: center; font-size: 12px; flex: none; }

.pane > .card + .card { margin-top: 12px; }
.theory { background: var(--blue-soft); border: 1px solid #c9dbf1; }
.method { background: var(--gold-soft); border: 1px solid #f3dc97; }
.method h3, .theory h3 { margin-top: 0; }
.md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 22px; }

.chap button.on { border-color: var(--gold); background: var(--gold-soft); }

.q + .q { margin-top: 10px; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.opt { text-align: left; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 8px 10px; display: flex; gap: 8px; align-items: baseline; }
.opt b { color: var(--muted); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ds { width: 100%; border-collapse: collapse; margin-top: 8px; }
.ds td { border-top: 1px solid var(--line); padding: 7px 4px; vertical-align: middle; }
.ds td.c { width: 112px; text-align: right; white-space: nowrap; }

.ds button.sel { background: var(--blue); color: #fff; border-color: var(--blue); }

.tln { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.tln input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 140px; font: inherit; }
.fb { margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); } .fb.bad { background: var(--bad-soft); color: var(--bad); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; }
.score { font-size: 40px; font-weight: 800; }
.skills { display: grid; gap: 8px; }
.sk { display: grid; grid-template-columns: 90px 1fr 140px; gap: 10px; align-items: center; }
table.tb { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13px; }
table.tb th, table.tb td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; }

@media (max-width: 760px) {

  .week { grid-template-columns: 1fr; } .wk { padding-top: 0; }
  .sk { grid-template-columns: 70px 1fr; } .sk .bar { grid-column: 1 / -1; }
}

<style>/* Website thương hiệu — mọi lớp có tiền tố s- để không đụng giao diện lộ trình (style.css).

.s-nav a:hover { color: var(--navy); }
.s-nav a.on { color: var(--navy); font-weight: 700; background: none; }
.s-nav a.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--gold); }

/* Tiêu đề khối: biểu tượng + chữ, căn trái; phần phải là liên kết hoặc tab */

.s-eyebrow { display: inline-flex; gap: 8px; align-items: center; background: rgba(242,183,5,.14); color: var(--gold); border: 1px solid rgba(242,183,5,.35); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }

.s-hv-card { background: #fff; color: var(--s-ink); border-radius: 24px; padding: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.35); }
.s-hv-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--s-muted); }
.s-hv-t { display: block; font-size: 18px; margin: 10px 0 6px; line-height: 1.3; }
.s-hv-ring { position: relative; width: 132px; height: 132px; margin: 8px auto 14px; }
.s-hv-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.s-hv-ring circle { fill: none; stroke-width: 12; }
.s-hv-ring .bg { stroke: #eef1f6; } .s-hv-ring .fg { stroke: var(--gold); stroke-linecap: round; }
.s-hv-ring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.s-hv-ring b { font-size: 30px; color: var(--navy); line-height: 1; } .s-hv-ring small { color: var(--s-muted); font-size: 12px; }
.s-hv-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.s-hv-steps span { display: flex; gap: 5px; align-items: center; justify-content: center; padding: 8px 4px; border-radius: 10px; background: var(--s-bg); font-size: 12.5px; color: var(--s-muted); }
.s-hv-steps span .s-ic { width: 15px; height: 15px; }
.s-hv-steps span.done { background: #e9f6ef; color: var(--s-ok); font-weight: 600; }
.s-float { position: absolute; display: flex; gap: 10px; align-items: center; background: #fff; color: var(--s-ink); border-radius: 14px; padding: 9px 14px 9px 10px; box-shadow: 0 14px 34px rgba(0,0,0,.25); animation: s-noi 5s ease-in-out infinite; }
.s-float > .s-ic { width: 34px; height: 34px; padding: 7px; border-radius: 10px; color: #fff; }
.s-float small { display: block; font-size: 11.5px; color: var(--s-muted); } .s-float b { font-size: 14px; white-space: nowrap; }
.s-float.f1 { top: 0; right: -34px; } .s-float.f1 > .s-ic { background: var(--s-ok); }
.s-float.f2 { top: 150px; left: -70px; animation-delay: -1.6s; } .s-float.f2 > .s-ic { background: var(--sky); }
.s-float.f3 { bottom: 0; right: -18px; animation-delay: -3.2s; } .s-float.f3 > .s-ic { background: var(--gold); color: var(--navy); }
@keyframes s-noi { 50% { transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .s-float { animation: none; } }

/* Đếm ngược: thẻ lớn đè lên mép dưới hero */
.s-cd-wrap { position: relative; z-index: 2; margin-top: -88px; }
.s-cd { display: grid; grid-template-columns: 1.25fr .75fr; gap: 28px; padding: 34px; border-radius: 28px; color: #fff; box-shadow: 0 30px 60px rgba(20,40,75,.22);
  background:
    linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px) 0 0 / 32px 32px,
    radial-gradient(600px 300px at 0% 100%, rgba(242,183,5,.22), transparent 60%),
    linear-gradient(135deg, #1d4f9e 0%, var(--navy) 70%); }
.s-cd-kick { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
.s-cd-kick .s-ic { width: 18px; height: 18px; }
.s-cd h2 { font-size: clamp(24px, 3vw, 34px); margin: 8px 0 6px; letter-spacing: -.6px; }
.s-cd-sub { display: flex; gap: 8px; align-items: center; color: #d5def0; font-size: 15px; }
.s-cd-sub .s-ic { width: 18px; height: 18px; } .s-cd-sub b { color: var(--gold); }
.s-cd-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 26px; max-width: 560px; }
.s-cd-t { text-align: center; }
.s-cd-t b { display: block; background: #fff; color: var(--navy); border-radius: 18px; padding: 22px 0; font-size: clamp(34px, 4.4vw, 52px); font-weight: 800; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; box-shadow: 0 12px 26px rgba(0,0,0,.18); border-bottom: 5px solid var(--gold); }
.s-cd-t span { display: block; margin-top: 10px; font-weight: 600; color: #d5def0; }
.s-cd-list { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); border-radius: 20px; padding: 16px; display: grid; gap: 8px; align-content: start; }
.s-cd-lh { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-bottom: 4px; color: #e6ecf7; }
.s-cd-lh .s-ic { width: 18px; height: 18px; }
.s-cd-i { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 10px 12px; border-radius: 12px; border: 0; background: #fff; color: var(--s-ink); font: inherit; cursor: pointer; transition: transform .12s; }
.s-cd-i:hover { transform: translateX(3px); }
.s-cd-i b { display: block; font-size: 14px; } .s-cd-i small { color: var(--s-muted); font-size: 12px; }
.s-cd-i em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--s-muted); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.s-cd-i em .s-ic { width: 14px; height: 14px; }
.s-cd-i.on { background: var(--gold); } .s-cd-i.on small, .s-cd-i.on em { color: var(--navy); }
.s-cd-i.on em { background: #fff; padding: 3px 8px; border-radius: 999px; }
.s-cd-i.past { opacity: .6; }
.s-cd-i.goal:not(.on) { box-shadow: inset 0 0 0 2px var(--gold); }

/* Thẻ lộ trình nổi bật */
#khoa-hoc { padding-top: 64px; }
.s-kh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-bottom: 56px; }
.s-kh { background: #fff; border: 1px solid var(--s-line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.s-kh:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgba(20,40,75,.12); }
.s-kh-th { position: relative; display: block; aspect-ratio: 16 / 9; padding: 20px 22px; color: #fff; overflow: hidden; }
.s-kh-th.t1 { background: linear-gradient(135deg, #2f6fd6, var(--navy)); }
.s-kh-th.t2 { background: linear-gradient(135deg, #17907a, #0f4b5c); }
.s-kh-th.t3 { background: linear-gradient(135deg, #e3542b, #8e1f2d); }
.s-kh-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 999px; }
.s-kh-th b { display: block; margin-top: 12px; font-size: clamp(26px, 2.6vw, 34px); font-weight: 800; letter-spacing: -1px; line-height: 1.05; text-transform: uppercase; }
.s-kh-th small { display: block; margin-top: 6px; color: rgba(255,255,255,.85); font-weight: 500; }
.s-kh-stairs { position: absolute; right: 14px; bottom: 10px; width: 46%; color: var(--gold); opacity: .9; }
.s-kh-th.t3 .s-kh-stairs { color: #ffd34d; }
.s-kh-rib { position: absolute; top: 16px; right: -38px; transform: rotate(35deg); background: var(--gold); color: var(--navy); font-size: 11.5px; font-weight: 800; padding: 5px 44px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.s-kh-b { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.s-kh-b h3 { margin: 0; font-size: 16px; letter-spacing: -.2px; }
.s-kh-b p { margin: -4px 0 0; font-size: 14px; color: var(--s-muted); }
.s-kh-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.s-kh-tags span { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.s-kh-tags .s-ic { width: 14px; height: 14px; }
.s-kh-tags .v { background: #e8f0fc; color: var(--sky); } .s-kh-tags .k { background: #fdeee6; color: #c2410c; } .s-kh-tags .r { background: #e6f5ee; color: var(--s-ok); }
.s-kh-st { list-style: none; margin: 0 0 6px; padding: 12px 0 0; border-top: 1px dashed var(--s-line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.s-kh-st li { display: flex; flex-direction: column; font-size: 12.5px; color: var(--s-muted); }
.s-kh-st li .s-ic { width: 18px; height: 18px; color: var(--navy); margin-bottom: 4px; }
.s-kh-st b { font-size: 20px; color: var(--s-ink); line-height: 1.1; }
.s-kh-b .s-btn { margin-top: auto; }

/* Tab giai đoạn + ô chương */
.s-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.s-tabs button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--s-line); background: #fff; color: var(--s-muted); cursor: pointer; }
.s-tabs button:hover { border-color: var(--navy); color: var(--navy); }
.s-tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.s-ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.s-ch { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 16px; background: var(--s-bg); border: 1px solid transparent; color: var(--s-ink); transition: border-color .15s, background .15s; }
.s-ch:hover { background: #fff; border-color: var(--gold); }
.s-ch small { font-size: 12px; font-weight: 700; color: var(--gold-2); text-transform: uppercase; letter-spacing: .8px; }
.s-ch b { font-size: 15.5px; line-height: 1.35; }
.s-ch span { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--s-muted); }
.s-ch span .s-ic { width: 16px; height: 16px; color: var(--navy); }

/* Tất cả trong một */
.s-feat { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.s-feat-i { background: #fff; border: 1px solid var(--s-line); border-radius: 18px; padding: 22px 16px; text-align: center; transition: transform .15s, box-shadow .15s; }
.s-feat-i:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(20,40,75,.08); }
.s-feat-ic { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--navy); color: var(--gold); }
.s-feat-ic .s-ic { width: 26px; height: 26px; }
.s-feat-i b { display: block; font-size: 15.5px; margin-bottom: 4px; }
.s-feat-i span { font-size: 13.5px; color: var(--s-muted); }
.s-diff { background: #fff; }

/* Học sinh & phụ huynh */
.s-split { display: grid; grid-template-columns: .9fr 1.1fr; gap: 48px; align-items: center; }
.s-ticks { list-style: none; padding: 0; margin: 24px 0 28px; display: grid; gap: 14px; }
.s-ticks li { display: flex; gap: 10px; font-size: 16px; color: #39425a; }
.s-ticks .s-ic { color: var(--s-ok); margin-top: 2px; }
.s-mocks { display: grid; grid-template-columns: .8fr 1.2fr; gap: 16px; align-items: center; }
.s-phone { background: var(--navy); border-radius: 30px; padding: 10px; box-shadow: 0 24px 50px rgba(20,40,75,.22); }
.s-phone-in { background: #fff; border-radius: 22px; padding: 14px; }
.s-ph-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
.s-ph-row { display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-radius: 10px; font-size: 13px; color: var(--s-muted); }
.s-ph-row .s-ic { width: 18px; height: 18px; }
.s-ph-row span { flex: 1; }
.s-ph-row.done { color: var(--s-ink); }
.s-ph-row .ok { color: var(--s-ok); }
.s-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #cfd5e0; }
.s-ph-bar { height: 6px; background: #eceef2; border-radius: 9px; overflow: hidden; margin-top: 10px; }
.s-ph-bar i { display: block; height: 100%; background: var(--gold); }
.s-ph-note { font-size: 11.5px; color: var(--s-muted); margin-top: 6px; }
.s-report { background: #fff; border: 1px solid var(--s-line); border-radius: 20px; padding: 18px; box-shadow: 0 18px 40px rgba(20,40,75,.10); }
.s-rp-hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.s-rp-hd small, .s-rp-grid small, .s-rp-sk > small { display: block; font-size: 12px; color: var(--s-muted); }
.s-rp-hd b { font-size: 15px; }
.s-rp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.s-rp-grid div { background: var(--s-bg); border-radius: 12px; padding: 10px; }
.s-rp-grid b { font-size: 22px; color: var(--navy); }
.s-rp-row { display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center; font-size: 13px; margin-top: 7px; }
.s-rp-bar { height: 7px; background: #eceef2; border-radius: 9px; overflow: hidden; }
.s-rp-bar i { display: block; height: 100%; border-radius: 9px; }
.s-rp-note { display: flex; gap: 8px; margin-top: 14px; padding: 10px 12px; background: var(--cream); border: 1px solid #f6e3a6; border-radius: 12px; font-size: 13px; color: #4a4120; }
.s-rp-note .s-ic { color: var(--gold-2); width: 18px; height: 18px; }

.s-diff { max-width: 820px; margin: 44px auto 0; border: 1px solid var(--s-line); border-radius: 18px; overflow: hidden; }
.s-diff-hd, .s-diff-r { display: grid; grid-template-columns: 1.3fr .9fr 1.1fr; align-items: center; }
.s-diff-hd span { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--s-muted); background: var(--s-bg); }
.s-diff-hd span.me { background: var(--navy); color: var(--gold); }
.s-diff-r span { padding: 13px 16px; border-top: 1px solid var(--s-line); font-size: 15px; display: flex; gap: 6px; align-items: center; }
.s-diff-r .no { color: #c0392b; } .s-diff-r .no .s-ic { width: 18px; height: 18px; }
.s-diff-r .yes { background: #f2f6fc; color: var(--navy); font-weight: 600; } .s-diff-r .yes .s-ic { color: var(--s-ok); width: 18px; height: 18px; }

/* Hướng dẫn */
.s-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.s-step { background: #fff; border: 1px solid var(--s-line); border-radius: 20px; padding: 26px 20px; text-align: center; position: relative; }
.s-step-n { position: absolute; top: 14px; left: 16px; font-size: 13px; font-weight: 800; color: var(--gold-2); }
.s-step-ic { width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 14px; display: grid; place-items: center; background: var(--cream); color: var(--navy); border: 1px solid #f6e3a6; }
.s-step-ic .s-ic { width: 28px; height: 28px; }
.s-step b { display: block; font-size: 17px; margin-bottom: 4px; }
.s-step span { font-size: 14px; color: var(--s-muted); }
.s-faq { max-width: 780px; margin: 48px auto 0; }
.s-faq details { border-bottom: 1px solid var(--s-line); padding: 16px 0; }
.s-faq summary { cursor: pointer; font-weight: 600; font-size: 16px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
.s-faq summary::-webkit-details-marker { display: none; }
.s-faq summary::after { content: "+"; color: var(--gold-2); font-size: 22px; line-height: 1; }
.s-faq details[open] summary::after { content: "–"; }
.s-faq details p { color: var(--s-muted); margin: 10px 0 0; }

/* Đăng ký */
.s-reg { background: radial-gradient(700px 360px at 10% 0%, #2b4c86 0%, transparent 60%), linear-gradient(160deg, var(--navy), var(--navy-3)); color: #fff; padding: 88px 0; }
.s-reg-in { display: grid; grid-template-columns: 1fr 460px; gap: 48px; align-items: center; }
.s-reg h2 { color: #fff; margin: 16px 0 22px; }
.s-gifts { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 12px; }
.s-gifts li { display: flex; gap: 10px; font-size: 17px; }
.s-gifts .s-ic { color: var(--gold); }
.s-urgent { display: flex; gap: 10px; align-items: center; background: rgba(242,183,5,.12); border: 1px solid rgba(242,183,5,.35); border-radius: 14px; padding: 12px 16px; color: #ffe08a; }
.s-urgent b { color: #fff; }
.s-form { background: #fff; color: var(--s-ink); border-radius: 22px; padding: 26px; box-shadow: 0 30px 60px rgba(0,0,0,.25); display: grid; gap: 12px; }
.s-form h3 { margin: 0 0 4px; font-size: 20px; }
.s-form label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; color: #39425a; }
.s-form input, .s-form select { font: inherit; font-weight: 400; border: 1px solid #d5dae4; border-radius: 10px; padding: 11px 12px; background: #fff; color: var(--s-ink); }
.s-form input:focus, .s-form select:focus { outline: 2px solid rgba(242,183,5,.6); border-color: var(--gold); }
.s-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.s-form-note { margin: 0; font-size: 12.5px; color: var(--s-muted); text-align: center; }
.s-form-msg { font-size: 14px; background: var(--s-bg); border-radius: 10px; padding: 10px 12px; }
.s-form-msg.bad { background: #fdecdf; color: #c2410c; }
.s-done { text-align: center; padding: 20px 6px; }
.s-done > .s-ic { width: 56px; height: 56px; color: #fff; background: var(--s-ok); border-radius: 50%; padding: 12px; }
.s-done h3 { margin: 12px 0 6px; } .s-done p { color: var(--s-muted); }


/* Khu lộ trình (nhúng ứng dụng) */
.s-subnav { background: var(--s-bg); border-bottom: 1px solid var(--s-line); }
.s-subnav .s-wrap { display: flex; gap: 6px; align-items: center; height: 52px; flex-wrap: wrap; }
.s-subnav a { padding: 6px 12px; border-radius: 999px; color: var(--s-muted); font-size: 14px; font-weight: 500; }
.s-subnav a.on { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.s-sub-note { margin-left: auto; font-size: 12px; color: var(--s-muted); }
.s-subnav .tk a { padding: 6px 10px; }
.s-subnav .tk .btn { padding: 6px 14px; }
#s-app-shell main { max-width: 1180px; padding: 26px 24px 60px; }
#s-app-shell .card, #s-app-shell .q, #s-app-shell table.tb { border-radius: 14px; }
#s-app-shell .btn.pri { background: var(--navy); border-color: var(--navy); }


/* Triết lý: ba bậc thang đi lên */
.s-band { background: linear-gradient(150deg, var(--navy), var(--navy-2)); color: #fff; padding: 72px 0 80px; text-align: center; }
.s-band-q { font-size: clamp(26px, 3.6vw, 40px); font-weight: 800; letter-spacing: -.8px; margin-bottom: 44px; }
.s-flow { display: flex; align-items: flex-end; justify-content: center; gap: 16px; flex-wrap: wrap; }
.s-flow-i { width: 260px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 22px 18px; margin-bottom: calc(var(--b) * 28px); }
.s-flow-i:last-child { background: linear-gradient(160deg, #ffcf3a, var(--gold)); color: var(--navy); border: 0; box-shadow: 0 16px 40px rgba(242,183,5,.25); }
.s-flow-i:last-child span, .s-flow-i:last-child .s-flow-n { color: #4d3f00; }
.s-flow-i:last-child .s-flow-ic { background: var(--navy); color: var(--gold); }
.s-flow-n { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9fb0cf; margin-bottom: 10px; }
.s-flow-ic { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; background: var(--gold); color: var(--navy); }
.s-flow-ic .s-ic { width: 26px; height: 26px; }
.s-flow-i b { display: block; font-size: 20px; margin-bottom: 4px; }
.s-flow-i span { color: #c9d4e8; font-size: 14px; }

/* Giáo viên: chân dung lớn có chữ chìm + 2 danh sách tích */
.s-gv { display: grid; grid-template-columns: 420px 1fr; gap: 48px; align-items: center; }
.s-gv-art { position: relative; height: 420px; }
.s-gv-wm { position: absolute; top: 0; left: 0; font-size: 104px; font-weight: 800; line-height: .92; letter-spacing: -4px; color: #e3e9f4; user-select: none; }
.s-gv-art::before { content: ""; position: absolute; right: 10px; bottom: 10px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #2f6fd6, var(--navy)); }
.s-gv-av { position: absolute; right: 45px; bottom: 45px; width: 250px; height: 250px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: linear-gradient(150deg, var(--navy-2), var(--navy-3)); border: 8px solid #fff; box-shadow: 0 24px 50px rgba(20,40,75,.25); color: #fff; }
.s-gv-av b { font-size: 92px; font-weight: 800; letter-spacing: -4px; } .s-gv-av b span { color: var(--gold); }
.s-gv-av img { width: 100%; height: 100%; object-fit: cover; }
.s-gv-name { position: absolute; bottom: 30px; left: 20px; display: inline-flex; gap: 8px; align-items: center; background: #fff; color: var(--navy); font-weight: 700; padding: 9px 16px; border-radius: 999px; border: 2px solid var(--gold); box-shadow: 0 10px 24px rgba(20,40,75,.15); }

:"VID-03"},{"khoi":"TL-03","vai_tro":"luyen_tap"},{"khoi":"TL-05","vai_tro":"luyen_tap","bat_buoc":false}]}],"kiem_tra":{"ten":"Kiểm tra 15' – Bài 1","loai":"cuoi_buoi","thoi_gian_phut":15,"cach_tao":"ngau_nhien","so_lan_lam_toi_da":2,"hien_dap_an":"sau_khi_nop","ma_tran":[{"loai":"CAU_TN4","so_cau":3,"diem_moi_cau":1.0,"ky_nang":["9010101","9010102","9010103"],"muc_do":["NB","TH"]},{"loai":"CAU_DS","so_cau":1,"diem_moi_cau":4.0,"ky_nang":["9010102","9010103"]},{"loai":"CAU_TLN","so_cau":2,"diem_moi_cau":1.5,"ky_nang":["9010101","9010102"],"muc_do":["NB","TH"]}]},"btvn":[{"khoi":"TL-02","han":"buoi_sau"},{"khoi":"TL-04","han":"buoi_sau"},{"khoi":"TLN-03","han":"buoi_sau"}]},"noi_dung":{"nguon":{"ten":"Gói tự soạn 91001","nguon_goc":"thay_soan","quyen_su_dung":"cong_khai","xac_minh":"sympy"},"khoi":[{"id":"LT-01","loai":"LY_THUYET","ky_nang":"9010101","tieu_de":"Phương trình bậc nhất hai ẩn","noi_dung":"**Phương trình bậc nhất hai ẩn** $x, y$ là hệ thức dạng $ax + by = c$,\ntrong đó $a, b, c$ là các số đã biết và $a \\neq 0$ hoặc $b \\neq 0$.\n\nNếu $ax_0 + by_0 = c$ là khẳng định đúng thì cặp số $(x_0; y_0)$ là **một nghiệm** của phương trình.\n"},{"id":"LT-02","loai":"LY_THUYET","ky_nang":"9010102","tieu_de":"Tập nghiệm và đường thẳng biểu diễn","noi_dung":"Mỗi phương trình bậc nhất hai ẩn có **vô số nghiệm**. Trên mặt phẳng toạ độ, tập nghiệm\nlà một **đường thẳng** $ax + by = c$:\n\n- $a \\neq 0,\\ b \\neq 0$: đường thẳng $y = -\\dfrac{a}{b}x + \\dfrac{c}{b}$;\n- $a = 0,\\ b \\neq 0$: đường thẳng $y = \\dfrac{c}{b}$, song song (hoặc trùng) trục $Ox$;\n- $a \\neq 0,\\ b = 0$: đường thẳng $x = \\dfrac{c}{a}$, song song (hoặc trùng) trục $Oy$.\n"},{"id":"LT-03","loai":"LY_THUYET","ky_nang":"9010103","tieu_de":"Hệ hai phương trình bậc nhất hai ẩn","noi_dung":"Hệ hai phương trình bậc nhất hai ẩn có dạng\n$\\begin{cases} ax + by = c \\\\ a'x + b'y = c' \\end{cases}$\n\nCặp số $(x_0; y_0)$ là **nghiệm của hệ** nếu nó là nghiệm của **cả hai** phương trình.\nVề hình học, đó là toạ độ giao điểm của hai đường thẳng.\n"},{"id":"PP-01","loai":"PHUONG_PHAP","ky_nang":"9010101","tieu_de":"Dạng 1. Nhận biết phương trình bậc nhất hai ẩn; kiểm tra nghiệm","noi_dung":"1. Đưa hệ thức về dạng $ax + by = c$; kiểm tra **không** có $x^2$, $xy$, $\\dfrac{1}{x}$, …\n2. Kiểm tra điều kiện $a \\neq 0$ hoặc $b \\neq 0$.\n3. Kiểm tra nghiệm: thay $x = x_0,\\ y = y_0$ vào vế trái, so sánh với $c$.\n"},{"id":"PP-02","loai":"PHUONG_PHAP","ky_nang":"9010102","tieu_de":"Dạng 2. Viết nghiệm tổng quát và vẽ đường thẳng nghiệm","noi_dung":"1. Nếu $b \\neq 0$: rút $y = \\dfrac{c - ax}{b}$, nghiệm tổng quát $\\left(x; \\dfrac{c-ax}{b}\\right)$, $x \\in \\mathbb{R}$.\n2. Nếu $b = 0$: nghiệm $\\left(\\dfrac{c}{a}; y\\right)$, $y \\in \\mathbb{R}$.\n3. Vẽ: lấy hai điểm dễ tính (thường là giao với hai trục) rồi nối.\n"},{"id":"PP-03","loai":"PHUONG_PHAP","ky_nang":"9010103","tieu_de":"Dạng 3. Kiểm tra một cặp số có là nghiệm của hệ","noi_dung":"Thay cặp số vào **từng** phương trình. Chỉ khi thoả mãn cả hai mới là nghiệm của hệ.\nMẹo: thử phương trình dễ trước — sai ở phương trình nào thì loại ngay.\n"},{"id":"VD-01","loai":"VI_DU","ky_nang":"9010101","muc_do":"NB","de":"Trong các hệ thức $2x - 5y = 3$; $\\ 0x + 3y = 6$; $\\ x^2 + y = 1$; $\\ 0x + 0y = 2$,\nhệ thức nào là phương trình bậc nhất hai ẩn?\n","loi_giai":["$2x - 5y = 3$ có $a = 2 \\neq 0$: là phương trình bậc nhất hai ẩn.","$0x + 3y = 6$ có $b = 3 \\neq 0$: là phương trình bậc nhất hai ẩn.","$x^2 + y = 1$ chứa $x^2$: không phải.","$0x + 0y = 2$ có $a = b = 0$: không phải."],"dap_an":"$2x - 5y = 3$ và $0x + 3y = 6$"},{"id":"VD-02","loai":"VI_DU","ky_nang":"9010101","muc_do":"NB","de":"Cặp số nào là nghiệm của phương trình $3x + 2y = -1$: $(1; -2)$ hay $(2; 1)$?\n","loi_giai":["Với $(1;-2)$: $3 \\cdot 1 + 2 \\cdot (-2) = -1$ đúng.","Với $(2;1)$: $3 \\cdot 2 + 2 \\cdot 1 = 8 \\neq -1$."],"dap_an":"$(1; -2)$"},{"id":"VD-03","loai":"VI_DU","ky_nang":"9010102","muc_do":"TH","de":"Viết nghiệm tổng quát của phương trình $2x - y = 4$ và vẽ đường thẳng biểu diễn tập nghiệm.\n","loi_giai":["Rút $y = 2x - 4$. Nghiệm tổng quát: $(x; 2x - 4)$ với $x \\in \\mathbb{R}$.","Cho $x = 0 \\Rightarrow y = -4$: điểm $A(0; -4)$. Cho $y = 0 \\Rightarrow x = 2$: điểm $B(2; 0)$.","Đường thẳng $AB$ là đường thẳng $2x - y = 4$."],"dap_an":"$(x; 2x-4),\\ x \\in \\mathbb{R}$"},{"id":"VD-04","loai":"VI_DU","ky_nang":"9010103","muc_do":"TH","de":"Cho hệ $\\begin{cases} x + y = 5 \\\\ 2x - y = 1 \\end{cases}$.\nCặp số $(2; 3)$ và $(3; 2)$, cặp nào là nghiệm của hệ?\n","loi_giai":["Với $(2;3)$: $2 + 3 = 5$ đúng; $2 \\cdot 2 - 3 = 1$ đúng ⇒ là nghiệm của hệ.","Với $(3;2)$: $3 + 2 = 5$ đúng; $2 \\cdot 3 - 2 = 4 \\neq 1$ ⇒ không là nghiệm."],"dap_an":"$(2; 3)$"},{"id":"TL-01","loai":"BAI_TL","ky_nang":"9010101","muc_do":"TH","thoi_gian":120,"de":"Tìm $m$ để cặp số $(2; -1)$ là nghiệm của phương trình $mx + 3y = 5$.","loi_giai":[{"noi_dung":"Thay $x = 2,\\ y = -1$: $2m - 3 = 5$.","diem":0.5},{"noi_dung":"$\\Rightarrow m = 4$.","diem":0.5}],"dap_an":{"gia_tri":"4","kieu":"so"}},{"id":"TL-02","loai":"BAI_TL","ky_nang":"9010102","muc_do":"TH","thoi_gian":240,"de":"Viết nghiệm tổng quát và vẽ đường thẳng biểu diễn tập nghiệm của mỗi phương trình:\na) $x - 3y = 6$; $\\quad$ b) $0x + 2y = 4$; $\\quad$ c) $3x + 0y = -6$.\n","loi_giai":[{"noi_dung":"a) $y = \\dfrac{x - 6}{3}$, nghiệm $\\left(x; \\dfrac{x-6}{3}\\right)$, $x\\in\\mathbb{R}$; đường thẳng qua $(0;-2)$ và $(6;0)$.","diem":0.5},{"noi_dung":"b) $y = 2$, nghiệm $(x; 2)$, $x\\in\\mathbb{R}$; đường thẳng song song $Ox$.","diem":0.25},{"noi_dung":"c) $x = -2$, nghiệm $(-2; y)$, $y\\in\\mathbb{R}$; đường thẳng song song $Oy$.","diem":0.25}]},{"id":"TL-03","loai":"BAI_TL","ky_nang":"9010103","muc_do":"TH","thoi_gian":150,"de":"Trong các cặp số $(3; 1)$, $(2; 3)$, $(-1; 9)$, cặp nào là nghiệm của hệ\n$\\begin{cases} 2x + y = 7 \\\\ x - 3y = -7 \\end{cases}$?\n","loi_giai":[{"noi_dung":"$(3;1)$: $2\\cdot3+1=7$ đúng; $3-3\\cdot1=0\\neq-7$ ⇒ loại.","diem":0.25},{"noi_dung":"$(2;3)$: $2\\cdot2+3=7$ đúng; $2-3\\cdot3=-7$ đúng ⇒ là nghiệm.","diem":0.5},{"noi_dung":"$(-1;9)$: $-2+9=7$ đúng; $-1-27=-28\\neq-7$ ⇒ loại.","diem":0.25}],"dap_an":{"gia_tri":"(2; 3)","kieu":"cap_so"}},{"id":"TL-04","loai":"BAI_TL","ky_nang":"9010101","muc_do":"VD","thoi_gian":300,"boi_canh":"thuc_te","de":"Vé xem xiếc giá 50 nghìn đồng/vé người lớn và 30 nghìn đồng/vé trẻ em.\nMột nhóm mua hết đúng 400 nghìn đồng. Gọi $x, y$ là số vé người lớn, trẻ em.\na) Viết phương trình liên hệ $x, y$. b) Liệt kê mọi khả năng $(x; y)$ với $x, y$ là số tự nhiên.\n","loi_giai":[{"noi_dung":"a) $50x + 30y = 400 \\Leftrightarrow 5x + 3y = 40$.","diem":0.25},{"noi_dung":"b) $3y = 40 - 5x$ chia hết cho $3$ và $\\geq 0$ ⇒ $x \\in \\{2; 5; 8\\}$.","diem":0.5},{"noi_dung":"Các khả năng: $(2;10)$, $(5;5)$, $(8;0)$.","diem":0.25}],"dap_an":{"gia_tri":"(2;10),(5;5),(8;0)","kieu":"van_ban"}},{"id":"TL-05","loai":"BAI_TL","ky_nang":"9010103","muc_do":"VD","thoi_gian":180,"de":"Tìm $a, b$ để hệ $\\begin{cases} ax + y = 5 \\\\ x + by = 4 \\end{cases}$ nhận $(1; 2)$ làm nghiệm.\n","loi_giai":[{"noi_dung":"Thay vào phương trình thứ nhất: $a + 2 = 5 \\Rightarrow a = 3$.","diem":0.5},{"noi_dung":"Thay vào phương trình thứ hai: $1 + 2b = 4 \\Rightarrow b = \\dfrac{3}{2}$.","diem":0.5}],"dap_an":{"gia_tri":"a=3; b=3/2","kieu":"van_ban"}},{"id":"TN-01","loai":"CAU_TN4","ky_nang":"9010101","muc_do":"NB","thoi_gian":45,"de":"Phương trình nào sau đây là phương trình bậc nhất hai ẩn?","lua_chon":{"A":{"noi_dung":"$x^2 + y = 2$","loi_sai":"Có $x^2$ nên không bậc nhất."},"B":{"noi_dung":"$0x + 0y = 1$","loi_sai":"Quên điều kiện $a \\neq 0$ hoặc $b \\neq 0$."},"C":{"noi_dung":"$3x - 0y = 5$"},"D":{"noi_dung":"$xy = 1$","loi_sai":"Tích $xy$ không phải dạng $ax + by$."}},"dap_an":"C","loi_giai":["$3x - 0y = 5$ có $a = 3 \\neq 0$ nên là phương trình bậc nhất hai ẩn."]},{"id":"TN-02","loai":"CAU_TN4","ky_nang":"9010101","muc_do":"NB","thoi_gian":45,"de":"Cặp số nào là nghiệm của phương trình $2x -   // ------------------------------------------------------------ BUỔI HỌC QUA ZOOM: recap + tài liệu
  // Recap đọc từ Google Sheet công khai (cột ma_buoi, ngay_hoc, link_recap, ghi_chu) — thầy dán link là hiện.
  let recapCache = null;
  function docCsv(t) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { if (c === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; }
      else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const [h, ...r] = rows; return r.filter((x) => x.some(Boolean)).map((x) => Object.fromEntries(h.map((k, j) => [k.trim(), (x[j] || "").trim()])));
  }
  async function layRecap() {
    if (recapCache) return recapCache;
    const R = D.recap || {}; let ds = [], loi = false;
    if (R.csv_url) {
      try { const r = await fetch(R.csv_url + "&_=" + Math.floor(Date.now() / 60000), { cache: "no-store" }); if (!r.ok) throw 0; ds = docCsv(await r.text()); }
      catch (e) { loi = true; }
    }
    recapCache = { ds: ds.concat(R.du_phong || []), loi };
    setTimeout(() => (recapCache = null), 60000);
    return recapCache;
  }
  const ngayVN = (s) => (/^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10).split("-").reverse().join("/") : esc(s));
  async function veRecap(el, ma, g) {
    el.innerHTML = '<p class="small muted">Đang tải link xem lại…</p>';
    let ds = [], loi = false;
    if (g && g.__cloud) { try { ds = await window.TV9C.recap(ma); } catch (e) { loi = true; } }
    else ({ ds, loi } = await layRecap());
    if (!el.isConnected) return;
    const cua = ds.filter((x) => String(x.ma_buoi) === ma && /^https:\/\//.test(x.link_recap || "")).sort((a, b) => String(b.ngay_hoc).localeCompare(String(a.ngay_hoc)));
    el.innerHTML = cua.length
      ? cua.map((x) => `<div class="recap"><div><b>Buổi học ${x.ngay_hoc ? ngayVN(x.ngay_hoc) : ""}</b>${x.ghi_chu ? `<div class="small muted">${esc(x.ghi_chu)}</div>` : ""}</div>
          <a class="btn gold" href="${esc(x.link_recap)}" target="_blank" rel="noopener">▶ Xem lại buổi học</a></div>`).join("") + '<p class="small muted" style="margin:8px 0 0">Mật khẩu xem bản ghi: thầy gửi trong nhóm Zalo lớp.</p>'
      : `<div class="banner" style="margin:0">${loi ? "Chưa tải được danh sách recap (kiểm tra kết nối mạng rồi mở lại trang)." : "Link xem lại sẽ có ở đây <b>sau khi buổi học kết thúc</b> – thầy cập nhật ngay khi Zoom xử lý xong bản ghi."}</div>`;
  }
  const tepTL = (t) => esc(t.url || t.tep);
  const theTL = (t, ic, g) => `<div class="tl"><span class="tl-ic">${ic}</span><div><b>${esc(t.ten)}</b><div class="small muted">PDF${t.so_trang ? ` · ${t.so_trang} trang` : ""}</div></div>
      ${g && g.__cloud && !t.url
        ? `<button class="btn" data-tai="${esc(t.tep)}">Mở</button><button class="btn" data-tai="${esc(t.tep)}" data-ve="1">Tải về</button>`
        : `<a class="btn" href="${tepTL(t)}" target="_blank" rel="noopener">Mở</a><a class="btn" href="${tepTL(t)}" download>Tải về</a>`}</div>`;
  // Link tải từ kho riêng chỉ sống 10 phút: tạo lúc bấm. Mở cửa sổ trước rồi mới gán địa chỉ (tránh bị chặn popup).
  function ganTaiLieu(el, ma) {

  function pZoom(pane, g, ma) {

      <div class="card"><h3 style="margin-top:0">Cách nộp</h3><ol><li>Làm bài vào vở, trình bày đầy đủ lời giải.</li><li>Chụp rõ từng trang, gửi thầy qua <b>Zalo</b> (ghi họ tên + mã buổi ${ma}).</li><li>Bấm nút dưới đây để đánh dấu đã làm xong.</li></ol>

  // ------------------------------------------------------------ câu hỏi (luyện tập: chấm ngay; kiểm tra: thu đáp án)
  const hinhCau = (k) => (/^(data:image\/|https:\/\/)/.test(k.hinh || "") ? `<img class="qimg" src="${esc(k.hinh)}" alt="Hình minh hoạ câu hỏi">` : "");
  function qHTML(k, idx, mode, thuTu) {
    const top = `<div class="hd">${idx ? `<b>Câu ${idx}.</b>` : ""}${chip(LOAI_CAU[k.loai] || k.loai)}${k.muc_do ? chip(k.muc_do) : ""}<span class="small muted">${esc(knTen(k.ky_nang))}</span></div>${md(k.de)}${hinhCau(k)}`;
    if (k.loai === "CAU_TN4") {
      const ord = thuTu || ["A", "B", "C", "D"];
      return top + `<div class="opts">${ord.map((goc, j) => `<button class="opt" data-o="${goc}"><b>${"ABCD"[j]}.</b><span>${inl(k.lua_chon[goc].noi_dung)}</span></button>`).join("")}</div>` + (mode === "lt" ? `<div class="fbx"></div>` : "");
    }
    if (k.loai === "CAU_DS") {
      return top + `<table class="ds">${k.y.map((y) => `<tr data-y="${y.nhan}"><td><b>${y.nhan})</b> ${inl(y.menh_de)}</td><td class="c"><button data-v="Đ">Đúng</button><button data-v="S">Sai</button></td></tr>`).join("")}</table>`
        + (mode === "lt" ? `<div class="row" style="margin-top:8px"><button class="btn pri" data-kiem>Kiểm tra</button></div><div class="fbx"></div>` : "");
    }
    if (k.loai === "CAU_TLN") {
      return top + `<div class="tln"><input placeholder="Đáp số" inputmode="decimal">${mode === "lt" ? '<button class="btn pri" data-kiem>Kiểm tra</button>' : ""}</div>` + (mode === "lt" ? `<div class="fbx"></div>` : "");
    }
    // tự luận
    const bs = buocList(k);
    return top + `<div class="row" style="margin-top:8px"><button class="btn" data-mo>Em đã làm vào vở – xem thang điểm</button></div>
      <div class="sol" style="display:none"><ol>${bs.map((b) => `<li>${inl(b.noi_dung)}${b.diem != null ? ` ${chip(b.diem + "đ", "gold")}` : ""}</li>`).join("")}</ol>
      <div class="row" style="margin-top:6px"><span class="small">Em tự chấm:</span><button class="btn" data-tu="1">Làm đúng</button><button class="btn" data-tu="0.5">Đúng một phần</button><button class="btn" data-tu="0">Chưa đúng</button></div><div class="fbx"></div></div>`;
  }
  const loiGiai = (k) => buocList(k).length ? `<div class="small" style="margin-top:6px">${buocList(k).map((b) => inl(b.noi_dung)).join("<br>")}</div>` : "";

  function ganLuyen(el, k, ma, ctx) {
    const fb = (ok, html) => { const f = el.querySelector(".fbx"); f.innerHTML = `<div class="fb ${ok ? "ok" : "bad"}">${html}</div>`; typeset(f); };
    const ghi = (diem) => { const st = sb(ma); if (st.lt[ctx + k.id] == null) { st.lt[ctx + k.id] = diem; ghiKn(k.ky_nang, diem, 1); } };
    if (k.loai === "CAU_TN4") {
      el.querySelectorAll(".opt").forEach((b) => (b.onclick = () => {
        const o = b.dataset.o, ok = o === k.dap_an;
        el.querySelectorAll(".opt").forEach((x) => x.classList.remove("sel", "right", "wrong"));
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) el.querySelector(`[data-o="${k.dap_an}"]`).classList.add("right");
        ghi(ok ? 1 : 0);
        fb(ok, ok ? "Chính xác! " + loiGiai(k) : `Chưa đúng. ${k.lua_chon[o].loi_sai ? "<b>Lỗi hay gặp:</b> " + inl(k.lua_chon[o].loi_sai) : ""}${loiGiai(k)}`);
      }));
    } else if (k.loai === "CAU_DS") {
      dsChon(el);
      el.querySelector("[data-kiem]").onclick = () => {
        let n = 0;
        k.y.forEach((y) => { const tr = el.querySelector(`[data-y="${y.nhan}"]`), v = tr.dataset.v, ok = (v === "Đ") === y.dung && v; tr.classList.toggle("right", !!ok); tr.classList.toggle("wrong", !ok); if (ok) n++; });
        ghi(THANG_DS[n]);
        fb(n === 4, `Đúng ${n}/4 ý → được ${THANG_DS[n] * 100}% điểm câu. Đáp án: ${k.y.map((y) => y.nhan + ") " + (y.dung ? "Đúng" : "Sai")).join(", ")}.`);
      };
    } else if (k.loai === "CAU_TLN") {
      el.querySelector("[data-kiem]").onclick = () => {
        const v = el.querySelector("input").value, ok = chamTLN(k, v);
        ghi(ok ? 1 : 0);
        fb(ok, ok ? "Chính xác! " + loiGiai(k) : `Chưa đúng. Đáp số: <b>${esc(k.dap_an.gia_tri)}</b>.${loiGiai(k)}`);
      };
    } else {
      el.querySelector("[data-mo]").onclick = () => { el.querySelector(".sol").style.display = "block"; typeset(el); };
      el.querySelectorAll("[data-tu]").forEach((b) => (b.onclick = () => { ghi(+b.dataset.tu); fb(+b.dataset.tu === 1, "Đã ghi nhận. Bài tự luận ở web thật sẽ do thầy chấm theo thang điểm từng bước."); }));
    }
  }
  function dsChon(el) {
    el.querySelectorAll("[data-y] button").forEach((b) => (b.onclick = () => {
      const tr = b.closest("tr"); tr.dataset.v = b.dataset.v;

  function chamTLN(k, v) {
    const a = so(k.dap_an.gia_tri), b = so(v);
    if (!isNaN(a) && !isNaN(b)) return Math.abs(a - b) <= (k.dap_an.sai_so || 0) + 1e-9;
    return String(v).replace(/\s/g, "") === String(k.dap_an.gia_tri).replace(/\s/g, "");

  function pLuyenTap(pane, g, ma) {

    pane.querySelectorAll("[data-k]").forEach((el) => ganLuyen(el, K[el.dataset.k], ma, "lt:"));

  function pBtvn(pane, g, ma) {
    const K = khoiMap(g), st = sb(ma);

  // ------------------------------------------------------------ KIỂM TRA NGẮN (bốc đề theo ma trận)
  function khoCau(g, dong) {
    const daDung = new Set(g.buoi.phan.flatMap((p) => p.noi_dung).filter((x) => ["luyen_tap", "btvn"].includes(x.vai_tro)).map((x) => x.khoi)
      .concat(g.buoi.btvn.map((x) => x.khoi)));
    return g.noi_dung.khoi.filter((k) => k.loai === dong.loai && dong.ky_nang.includes(k.ky_nang)
      && (!dong.muc_do || dong.muc_do.includes(k.muc_do)) && !daDung.has(k.id));
  }
  const coDinh = (kt) => kt.cach_tao === "co_dinh";
  function pKiemTra(pane, g, ma) {
    const kt = g.buoi.kiem_tra, st = sb(ma), conLan = (kt.so_lan_lam_toi_da || 99) - st.kt.length, K = khoiMap(g);
    pane.innerHTML = `<div class="card"><h3 style="margin-top:0">${esc(kt.ten)}</h3>
      ${coDinh(kt) ? `<p>${kt.thoi_gian_phut} phút · ${kt.cau.length} câu · tối đa ${kt.so_lan_lam_toi_da} lần · <b>máy chấm ngay</b>, đáp án và lời giải hiện sau khi nộp.</p>
      <table class="tb"><tr><th>Câu</th><th>Dạng câu</th><th>Mức độ</th><th>Điểm</th></tr>
      ${kt.cau.map((c, i) => `<tr><td>${i + 1}</td><td>${LOAI_CAU[K[c.khoi].loai]}</td><td>${K[c.khoi].muc_do || ""}</td><td>${c.diem}</td></tr>`).join("")}</table>`
      : `<p>${kt.thoi_gian_phut} phút · tối đa ${kt.so_lan_lam_toi_da} lần · đáp án hiện sau khi nộp. Mỗi lượt làm, máy <b>bốc một đề khác</b> theo ma trận, không lấy câu em đã gặp ở luyện tập/BTVN.</p>
      <table class="tb"><tr><th>Dạng câu</th><th>Kỹ năng</th><th>Mức độ</th><th>Số câu</th><th>Điểm/câu</th><th>Kho câu</th></tr>
      ${kt.ma_tran.map((d) => `<tr><td>${LOAI_CAU[d.loai]}</td><td>${d.ky_nang.join(", ")}</td><td>${(d.muc_do || ["mọi mức"]).join(", ")}</td><td>${d.so_cau}</td><td>${d.diem_moi_cau}</td><td>${khoCau(g, d).length}</td></tr>`).join("")}
      </table>`}
      ${st.kt.length ? `<p>Các lần đã làm: ${st.kt.map((x, i) => chip(`Lần ${i + 1}: ${x.diem.toFixed(1)}đ`, x.diem >= 5 ? "ok" : "bad")).join(" ")}</p>` : ""}
      <div class="row"><button class="btn pri" id="bd" ${conLan > 0 ? "" : "disabled"}>${conLan > 0 ? `Bắt đầu làm bài (còn ${conLan} lần)` : "Đã hết lượt làm"}</button>
      <span class="small muted">Thang Đúng/Sai: đúng 1/2/3/4 ý được 10/25/50/100% điểm câu.</span></div></div>`;
    if (conLan > 0) $("#bd").onclick = () => batDau(pane, g, ma);
  }
  function batDau(pane, g, ma) {
    const kt = g.buoi.kiem_tra, hat = Date.now() % 2147483647, r = rng(hat);
    const de = [];
    if (coDinh(kt)) { const K = khoiMap(g); kt.cau.forEach((c) => { const k = K[c.khoi]; de.push({ k, diem: c.diem, ord: k.loai === "CAU_TN4" ? tron(["A", "B", "C", "D"], r) : null }); }); }
    else kt.ma_tran.forEach((d) => tron(khoCau(g, d), r).slice(0, d.so_cau).forEach((k) => de.push({ k, diem: d.diem_moi_cau, ord: k.loai === "CAU_TN4" ? tron(["A", "B", "C", "D"], r) : null })));
    let con = kt.thoi_gian_phut * 60;
    pane.innerHTML = `<div class="card row" style="justify-content:space-between;position:sticky;top:62px;z-index:5">
        <span>${coDinh(kt) ? "Đáp án trắc nghiệm đã xáo thứ tự" : `Mã đề <code>${hat.toString(36).toUpperCase()}</code>`} · ${de.length} câu · 10 điểm</span><span class="timer" id="tm"></span></div>
      ${de.map((c, i) => `<div class="q" data-i="${i}">${qHTML(c.k, i + 1, "kt", c.ord)}</div>`).join("")}
      <div class="row" style="margin-top:12px"><button class="btn pri" id="nop">Nộp bài</button><span class="small muted">Trả lời ngắn: ghi số, dùng dấu phẩy cho số thập phân (vd 34,5).</span></div>`;
    pane.querySelectorAll(".q").forEach((el) => {
      el.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { el.querySelectorAll(".opt").forEach((x) => x.classList.toggle("sel", x === b)); el.dataset.tl = b.dataset.o; }));
      dsChon(el);
    });
    const tick = () => { if (!$("#tm")) { clearInterval(window.__timer); return; } $("#tm").textContent = `${Math.floor(con / 60)}:${String(con % 60).padStart(2, "0")}`; if (con-- <= 0) nop(); };
    typeset(pane);
    tick(); window.__timer = setInterval(tick, 1000);
    const nop = () => {
      clearInterval(window.__timer);
      let tong = 0; const theoKn = {};
      const kq = de.map((c, i) => {
        const el = pane.querySelector(`[data-i="${i}"]`), k = c.k; let ty = 0, tl = "";
        if (k.loai === "CAU_TN4") { tl = el.dataset.tl || ""; ty = tl === k.dap_an ? 1 : 0; }
        if (k.loai === "CAU_DS") { const n = k.y.filter((y) => { const v = el.querySelector(`[data-y="${y.nhan}"]`).dataset.v; return v && (v === "Đ") === y.dung; }).length; ty = THANG_DS[n]; tl = n + "/4 ý đúng"; }
        if (k.loai === "CAU_TLN") { tl = el.querySelector("input").value; ty = chamTLN(k, tl) ? 1 : 0; }
        const d = c.diem * ty; tong += d;
        (theoKn[k.ky_nang] = theoKn[k.ky_nang] || [0, 0]); theoKn[k.ky_nang][0] += ty; theoKn[k.ky_nang][1] += 1;
        return { c, d, ty, tl };
      });
      Object.entries(theoKn).forEach(([m, [a, b]]) => ghiKn(m, a, b));
      const st = sb(ma); st.kt.push({ diem: tong, ngay: new Date().toISOString(), ma_de: hat }); st.buoc.kiem_tra = true; save();
      const yeu = Object.entries(theoKn).filter(([, [a, b]]) => a / b < 0.6).map(([m]) => m);
      const V = (g.noi_dung.video || []);
      pane.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small muted">Kết quả</div><div class="score" style="color:${tong >= 5 ? "var(--ok)" : "var(--bad)"}">${tong.toFixed(2).replace(/\.?0+$/, "")}<span style="font-size:18px">/10</span></div></div>
        <div class="skills" style="min-width:260px">${Object.entries(theoKn).map(([m, [a, b]]) => `<div class="small">${esc(knTen(m))}<div class="bar"><i style="width:${(100 * a) / b}%;background:${a / b >= 0.6 ? "var(--ok)" : "var(--bad)"}"></i></div></div>`).join("")}</div></div>
        ${yeu.length ? `<div class="fb bad">Dạng cần ôn lại: ${yeu.map((m) => { const v = V.find((x) => x.ky_nang.includes(m)); return esc(knTen(m)) + (v ? ` — <a href="#" data-vid="${v.id}">xem video</a>` : ""); }).join("; ")}</div>` : `<div class="fb ok">Em đã nắm được các dạng của buổi này. Buổi đã được tính hoàn thành trên lộ trình.</div>`}
        <div class="row" style="margin-top:8px"><a class="btn" href="#lo-trinh">Về lộ trình</a><button class="btn" id="lai">Xem thông tin bài kiểm tra</button></div></div>
        <h2>Đáp án và lời giải</h2>
        ${kq.map(({ c, d, tl }, i) => { const k = c.k; const da = k.loai === "CAU_TN4" ? `Đáp án đúng: <b>${"ABCD"[c.ord.indexOf(k.dap_an)]}</b>` : k.loai === "CAU_DS" ? "Đáp án: " + k.y.map((y) => y.nhan + ") " + (y.dung ? "Đ" : "S")).join(" ") : `Đáp số: <b>${esc(k.dap_an.gia_tri)}</b>`;
          const em = k.loai === "CAU_TN4" ? (tl ? "ABCD"[c.ord.indexOf(tl)] : "bỏ trống") : esc(tl || "bỏ trống");
          return `<div class="q"><div class="hd"><b>Câu ${i + 1}.</b>${chip(LOAI_CAU[k.loai])}${chip(`${+d.toFixed(2)}/${c.diem}đ`, d === c.diem ? "ok" : d > 0 ? "gold" : "bad")}</div>${md(k.de)}${hinhCau(k)}<div class="small">Em trả lời: ${em} · ${da}</div>${loiGiai(k)}</div>`; }).join("")}`;
      pane.querySelectorAll("[data-vid]").forEach((x) => (x.onclick = (e) => { e.preventDefault(); diBuoc(ma, "video", x.dataset.vid); }));
      $("#lai").onclick = () => { pKiemTra(pane, g, ma); typeset(pane); };
      typeset(pane);
    };
    $("#nop").onclick = nop;
  }

  // ------------------------------------------------------------ GÓC GIÁO VIÊN: tiến độ sản xuất nội dung
  function sanSang(b) {
    const g = D.goi[b.ma];

    if (laZoom(g)) {
      const tl = (l) => (g.buoi.tai_lieu || []).some((t) => t.loai === l);
      return { bai_giang: tl("bai_giang"), vi_du: tl("bai_giang"), video: false, luyen_tap: tl("bai_giang"), kiem_tra: (g.buoi.kiem_tra?.cau || []).length > 0, btvn: tl("btvn"), dangOk: true };
    }
    const all = g.buoi.phan.flatMap((p) => p.noi_dung), K = khoiMap(g);
    const dangOk = phanDang(g).every((p) => vaiTro(p, "bai_giang").length && vaiTro(p, "vi_du").length && p.noi_dung.some((x) => x.video));
    const lt = all.filter((x) => x.vai_tro === "luyen_tap").map((x) => K[x.khoi]);
    const ktOk = (g.buoi.kiem_tra?.ma_tran || []).every((d) => khoCau(g, d).length >= d.so_cau);
    return {
      bai_giang: all.some((x) => x.vai_tro === "bai_giang"), vi_du: all.some((x) => x.vai_tro === "vi_du"),
      video: all.some((x) => x.video), luyen_tap: lt.length >= 5, kiem_tra: ktOk, btvn: (g.buoi.btvn || []).length > 0, dangOk,

      } catch (err) {
        msg.hidden = false; msg.className = "s-form-msg bad";
        msg.innerHTML = `Chưa gửi được (mất mạng hoặc trình duyệt chặn). Vui lòng thử lại${L.zalo ? ` hoặc nhắn Zalo <b>${esc(L.zalo)}</b>` : ""}.`;
        return;
      }
      form.innerHTML = `<div class="s-done">${ic("check")}<h3>Đăng ký thành công!</h3><p>Cảm ơn phụ huynh. ${esc(C.giao_vien)} sẽ liên hệ qua số <b>${esc(f.sdt)}</b> để gửi tài liệu và tư vấn lộ trình.</p><a class="s-btn navy" href="#buoi-91001">Học thử ngay</a></div>`;
      return;
    }
    const noiDung = `Đăng ký ${C.thuong_hieu}: ${f.ho_ten} – ${f.lop} – học lực: ${f.hoc_luc} – mục tiêu: ${f.muc_tieu} – SĐT phụ huynh: ${f.sdt}`;
    msg.hidden = false; msg.className = "s-form-msg";
    msg.innerHTML = L.zalo
      ? `Gửi thông tin cho thầy qua Zalo để hoàn tất: <b>${esc(L.zalo)}</b><br><button type="button" class="s-btn line sm" id="s-copy">Sao chép nội dung đăng ký</button>`
      : `<b>Bản xem thử:</b> website chưa kết nối nơi nhận đăng ký (Google Form) nên thông tin chưa được gửi đi. Thầy điền mục <code>dang_ky</code> trong <code>website/cau-hinh.yaml</code>.`;
    const nut = $("#s-copy");
    if (nut) nut.onclick = () => navigator.clipboard.writeText(noiDung).then(() => (nut.textContent = "Đã sao chép ✓"), () => (nut.textContent = noiDung));
  });

  // ------------------------------------------------------------------ định tuyến
  const home = $("#home"), shell = $("#s-app-shell"), sticky = $("#s-sticky");
  function dinhTuyen() {
    const h = location.hash.slice(1) || "trang-chu";
    $("#s-nav").classList.remove("open");
    if (window.TV9.laApp(h)) {
      home.hidden = true; shell.hidden = false; sticky.hidden = true;
      window.TV9.route();
      document.querySelectorAll(".s-subnav a").forEach((a) => a.classList.toggle("on", h.startsWith(a.dataset.sub) || (a.dataset.sub === "lo-trinh" && h.startsWith("buoi-"))));
      document.title = `Lộ trình học · ${C.thuong_hieu}`;
      dat("lo-trinh");
    } else {
      shell.hidden = true; home.hidden = false; sticky.hidden = h === "dang-ky";
      const muc = HOME.includes(h) ? h : "trang-chu";
      dat(muc);
      document.title = `${C.thuong_hieu} – ${C.giao_vien} · ${C.chuyen_mon}`;
      if (muc === "trang-chu") window.scrollTo(0, 0);
      else requestAnimationFrame(() => document.getElementById(muc).scrollIntoView());
    }
  }
  function dat(muc) { document.querySelectorAll(".s-nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === muc)); }
  $("#s-burger").onclick = () => $("#s-nav").classList.toggle("open");
  $("#xoa-tien-do").onclick = () => window.TV9.xoaTienDo();
  window.addEventListener("hashchange", dinhTuyen);
  dinhTuyen();
})();

</script>
</body>
</html>
