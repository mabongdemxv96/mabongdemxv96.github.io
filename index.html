        <p class="lead">${esc(C.mo_ta_ngan)}</p>
        <div class="s-cta"><a class="s-btn gold lg" href="#dang-ky">${ic("gift")} Đăng ký ngay – nhận tài liệu miễn phí</a><a class="s-btn ghost lg" href="#buoi-91001">${ic("play")} Học thử</a></div>
        <div class="s-stats">
          ${[["book", D.buoi_hoc.length, "buổi học", "a"], ["map", tongKN, "dạng toán", "b"], ["pen", tongKT, "bài kiểm tra", "c"]]
            .map(([i, n, t, k]) => `<div class="s-stat"><b>${n}</b><span class="${k}">${ic(i)}${t}</span></div>`).join("")}
        </div>
      </div>
      <div class="s-hero-art">${heroArt}</div>
    </div>
  </section>

  ${moc.length ? demNguoc() : ""}

  <section class="s-sec" id="khoa-hoc"><div class="s-wrap">
    ${tieuDe("book", "Lộ trình nổi bật", `<a class="s-more" href="#lo-trinh">Xem toàn bộ lộ trình ${ic("arrow")}</a>`)}
    <div class="s-kh-grid">${theoGD.map(theKhoa).join("")}</div>

    ${tieuDe("map", "Học gì ở từng giai đoạn", `<div class="s-tabs" role="tablist">${GD.map((t, i) => `<button type="button" role="tab" data-g="${i}" class="${i ? "" : "on"}">${t}</button>`).join("")}</div>`)}
    <div class="s-ch-grid" id="s-ch-grid">${oChuong(theoGD[0])}</div>
  </div></section>

  <section class="s-sec alt" id="tinh-nang"><div class="s-wrap">
    ${tieuDe("star", "Tất cả trong một – học trọn Toán 9 ở một nơi")}
    <div class="s-feat">${tinhNang.map(([i, t, d]) => `<div class="s-feat-i"><div class="s-feat-ic">${ic(i)}</div><b>${t}</b><span>${d}</span></div>`).join("")}</div>
    <div class="s-diff">
      <div class="s-diff-hd"><span></span><span>Học thêm thông thường</span><span class="me">${esc(C.thuong_hieu)}</span></div>
      ${[["Xem lại bài giảng ở nhà", "Video từng dạng"], ["Biết con hổng kỹ năng nào", "Bản đồ kỹ năng"], ["Kiểm tra sau mỗi buổi", "Tự chấm, có lời giải"], ["Báo cáo cho phụ huynh", "Tóm tắt từng tuần"]]
        .map(([t, b]) => `<div class="s-diff-r"><span>${t}</span><span class="no">${ic("x")}</span><span class="yes">${ic("check")} ${b}</span></div>`).join("")}
    </div>
  </div></section>

  <section class="s-sec" id="phu-huynh"><div class="s-wrap s-split">
    <div>
      <span class="s-kicker">Cho học sinh & phụ huynh</span>
      <h2 class="s-h2">Con học từng bước.<br>Bố mẹ thấy từng bước.</h2>
      <ul class="s-ticks">
        <li>${ic("check")}<span><b>Học sinh</b> đi lần lượt 6 bước mỗi buổi – rõ ràng, không bị ngợp.</span></li>
        <li>${ic("check")}<span><b>Phụ huynh</b> nhận báo cáo ngắn: đã học gì, điểm bao nhiêu, cần ôn gì.</span></li>
        <li>${ic("check")}<span><b>Thầy</b> theo sát từng kỹ năng và giao bài ôn đúng chỗ con còn yếu.</span></li>
      </ul>
      <a class="s-btn navy" href="#dang-ky">Đăng ký cho con</a>
    </div>
    <div class="s-mocks">${mauDienThoai}${mauBaoCao}</div>
  </div></section>

  <section class="s-band" id="triet-ly"><div class="s-wrap">
    <div class="s-band-q">“${esc(C.triet_ly)}”</div>
    <div class="s-flow">
      ${[["book", "Học kỹ", "Hiểu bản chất từng dạng, không học vẹt"], ["seed", "Chắc gốc", "Lấp lỗ hổng trước khi đi tiếp"], ["target", "Điểm cao", "Luyện đề, tự tin bước vào phòng thi"]]
        .map(([i, t, d], k) => `<div class="s-flow-i" style="--b:${k}"><div class="s-flow-n">Bậc ${k + 1}</div><div class="s-flow-ic">${ic(i)}</div><b>${t}</b><span>${d}</span></div>`).join("")}
    </div>
  </div></section>

  <section class="s-sec alt" id="gioi-thieu"><div class="s-wrap">
    ${tieuDe("user", "Giáo viên giảng dạy")}
    <div class="s-gv">
      <div class="s-gv-art">
        <div class="s-gv-wm" aria-hidden="true">VIỆT<br>ANH</div>
        <div class="s-gv-av">${C.anh_dai_dien ? `<img src="${esc(C.anh_dai_dien)}" alt="${esc(C.giao_vien)}">` : "<b>V<span>A</span></b>"}</div>
        <div class="s-gv-name">${ic("stairs")} ${esc(C.giao_vien)}</div>
      </div>
      <div class="s-gv-info">
        <h3>Thông tin giáo viên</h3>
        <ul class="s-ok-list">${(C.thong_tin_gv || [C.gioi_thieu_ngan]).map((t) => `<li>${ic("check")}<span>${dam(t)}</span></li>`).join("")}</ul>
        ${(C.phong_cach || []).length ? `<h3>Phong cách giảng dạy</h3><ul class="s-ok-list">${C.phong_cach.map((t) => `<li>${ic("check")}<span>${dam(t)}</span></li>`).join("")}</ul>` : ""}
        ${lh.length ? `<div class="s-chips">${lh.map(([k, v]) => `<span class="s-chip"><small>${k}</small> ${v}</span>`).join("")}</div>` : ""}
      </div>
    </div>
  </div></section>

  ${vinhDanh}

  <section class="s-sec" id="huong-dan"><div class="s-wrap">
    ${tieuDe("flag", "Bắt đầu chỉ với 4 bước")}
    <div class="s-steps">
      ${[["gift", "Đăng ký", "Điền thông tin, nhận tài liệu miễn phí"], ["map", "Mở lộ trình", "Chọn buổi tiếp theo được gợi ý sẵn"], ["play", "Học 6 bước", "Bài giảng → video → luyện tập → kiểm tra"], ["report", "Xem tiến bộ", "Bản đồ kỹ năng & báo cáo cho phụ huynh"]]
        .map(([i, t, d], k) => `<div class="s-step"><div class="s-step-n">${k + 1}</div><div class="s-step-ic">${ic(i)}</div><b>${t}</b><span>${d}</span></div>`).join("")}
    </div>
    <div class="s-faq">
      <details><summary>Con mất gốc có theo được không?</summary><p>Được. Lộ trình chia nhỏ theo từng kỹ năng; dạng nào còn hổng, hệ thống gợi ý ôn lại đúng video và bài luyện của dạng đó.</p></details>
      <details><summary>Học trên điện thoại được không?</summary><p>Được, không cần cài đặt. Mở website là học.</p></details>
      <details><summary>Phụ huynh theo dõi bằng cách nào?</summary><p>Qua báo cáo tóm tắt: số buổi đã học, điểm kiểm tra, kỹ năng cần ôn và nhận xét của thầy.</p></details>
      <details><summary>Hai bạn làm bài kiểm tra có cùng đề không?</summary><p>Không. Mỗi lượt làm, máy bốc câu theo ma trận và xáo thứ tự đáp án, độ khó tương đương.</p></details>
    </div>
  </div></section>

  <section class="s-reg" id="dang-ky"><div class="s-wrap s-reg-in">
    <div class="s-reg-copy">
      <span class="s-eyebrow">${ic("gift")} Quà tặng miễn phí</span>
      <h2>Đăng ký ngay – nhận trọn bộ quà học tập</h2>
      <ul class="s-gifts">${(C.qua_tang || []).map((q) => `<li>${ic("check")}<span>${esc(q)}</span></li>`).join("")}</ul>
      ${dich && conNgay(dich) >= 0 ? `<div class="s-urgent">${ic("clock")}<span>Chỉ còn <b>${conNgay(dich)} ngày</b> đến kỳ ${esc(dich.ten.toLowerCase())} – bắt đầu càng sớm, nền càng chắc.</span></div>` : ""}
    </div>
    <form class="s-form" id="s-form" novalidate>
      <h3>Thông tin đăng ký</h3>
      <label>Họ tên học sinh *<input name="ho_ten" required autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A"></label>
      <div class="s-row2">
        <label>Lớp<select name="lop"><option>Lớp 9</option><option>Lớp 8</option><option>Khác</option></select></label>
        <label>Học lực hiện tại<select name="hoc_luc"><option>Cần lấy gốc</option><option>Trung bình</option><option>Khá</option><option>Giỏi</option></select></label>
      </div>
      <label>Số điện thoại phụ huynh (Zalo) *<input name="sdt" required inputmode="tel" autocomplete="tel" placeholder="Ví dụ: 0905 123 456"></label>
      <label>Mục tiêu<select name="muc_tieu"><option>Lấy lại gốc Toán</option><option>Đạt điểm cao vào lớp 10</option><option>Ôn thi trường chuyên</option></select></label>
      <button class="s-btn gold lg full" type="submit">${ic("gift")} Đăng ký ngay – nhận tài liệu</button>
      <p class="s-form-note">Thông tin chỉ dùng để thầy liên hệ tư vấn và gửi tài liệu.</p>
      <div class="s-form-msg" id="s-form-msg" hidden></div>
    </form>
  </div></section>`;

  $("#s-footer").innerHTML = `<div class="s-wrap s-ft">
      <div class="s-ft-brand"><b>${esc(C.thuong_hieu)}</b><p>${esc(C.triet_ly)}</p><p>${esc(C.giao_vien)} · ${esc(C.chuyen_mon)}</p></div>
      <div><h4>Học tập</h4><a href="#lo-trinh">Lộ trình học</a><a href="#buoi-91001">Học thử miễn phí</a><a href="#ky-nang">Bản đồ kỹ năng</a></div>
      <div><h4>Về ${esc(C.thuong_hieu)}</h4><a href="#tinh-nang">Tất cả trong một</a><a href="#gioi-thieu">Giáo viên</a><a href="#huong-dan">Hướng dẫn & hỏi đáp</a><a href="#dang-ky">Đăng ký</a></div>
      <div><h4>Liên hệ</h4>${lh.length ? lh.map(([k, v]) => `<span>${k}: ${v}</span>`).join("") : "<span>Để lại số điện thoại ở mục Đăng ký, thầy sẽ gọi lại.</span>"}</div>
    </div>
    <div class="s-wrap s-ft-bt">© ${new Date().getFullYear()} ${esc(C.thuong_hieu)} · Kiên trì từng bước – tới thành công</div>`;

  // ------------------------------------------------------------------ tương tác trang chủ
  document.querySelectorAll(".s-cd-i").forEach((el) => (el.onclick = () => { chon = +el.dataset.i; capNhatDem(); }));
  capNhatDem();
  setInterval(capNhatDem, 1000);
  document.querySelectorAll(".s-tabs button").forEach((b) => (b.onclick = () => {
    document.querySelectorAll(".s-tabs button").forEach((x) => x.classList.toggle("on", x === b));
    $("#s-ch-grid").innerHTML = oChuong(theoGD[+b.dataset.g]);
  }));

  // ------------------------------------------------------------------ đăng ký
  const form = $("#s-form"), msg = $("#s-form-msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const sdt = (f.sdt || "").replace(/[\s.]/g, "");
    if (!f.ho_ten.trim() || !/^(0|\+84)\d{9,10}$/.test(sdt)) {
      msg.hidden = false; msg.className = "s-form-msg bad"; msg.textContent = "Vui lòng nhập họ tên và số điện thoại hợp lệ (10 số).";
      return;
    }
    const dk = C.dang_ky || {}, tr = dk.truong || {};
    if (dk.google_form_action && tr.ho_ten && tr.sdt) {
      const body = new FormData();
      Object.entries(tr).forEach(([k, entry]) => { if (entry) body.append(entry, f[k] || ""); });
      try {
        await fetch(dk.google_form_action, { method: "POST", mode: "no-cors", body }); // no-cors: gửi được thì promise thành công
      } catch (err) {
        msg.hidden = false; msg.className = "s-form-msg bad";
        msg.innerHTML = `Chưa gửi được (mất mạng hoặc trình duyệt chặn). Vui lòng thử lại${L.zalo ? ` hoặc nhắn Zalo <b>${esc(L.zalo)}</b>` : ""}.`;
        return;
      }
      form.innerHTML = `<div class="s-done">${ic("check")}<h3>Đăng ký thành công!</h3><p>Cảm ơn phụ huynh. ${esc(C.giao_vien)} sẽ liên hệ qua số <b>${esc(f.sdt)}</b> để gửi tài liệu và tư vấn lộ trình.</p><a class="s-btn navy" href="#buoi-91001">Học thử ngay</a></div>`;
      return;
    }
    const noiDung = `Đăng ký ${C.thuong_hieu}: ${f.ho_ten} – ${f.lop} – học lực: ${f.hoc_luc} – mục tiêu: ${f.muc_tieu} – SĐT phụ huynh: ${f.sdt}`;
    msg.hidden = false; msg.className = "s-form-msg";
    msg.innerHTML = L.zalo
      ? `Gửi thông tin cho thầy qua Zalo để hoàn tất: <b>${esc(L.zalo)}</b><br><button type="button" class="s-btn line sm" id="s-copy">Sao chép nội dung đăng ký</button>`
      : `<b>Bản xem thử:</b> website chưa kết nối nơi nhận đăng ký (Google Form) nên thông tin chưa được gửi đi. Thầy điền mục <code>dang_ky</code> trong <code>website/cau-hinh.yaml</code>.`;
    const nut = $("#s-copy");
    if (nut) nut.onclick = () => navigator.clipboard.writeText(noiDung).then(() => (nut.textContent = "Đã sao chép ✓"), () => (nut.textContent = noiDung));
  });

  // ------------------------------------------------------------------ định tuyến
  const home = $("#home"), shell = $("#s-app-shell"), sticky = $("#s-sticky");
  function dinhTuyen() {
    const h = location.hash.slice(1) || "trang-chu";
    $("#s-nav").classList.remove("open");
    if (window.TV9.laApp(h)) {
      home.hidden = true; shell.hidden = false; sticky.hidden = true;
      window.TV9.route();
      document.querySelectorAll(".s-subnav a").forEach((a) => a.classList.toggle("on", h.startsWith(a.dataset.sub) || (a.dataset.sub === "lo-trinh" && h.startsWith("buoi-"))));
      document.title = `Lộ trình học · ${C.thuong_hieu}`;
      dat("lo-trinh");
    } else {
      shell.hidden = true; home.hidden = false; sticky.hidden = h === "dang-ky";
      const muc = HOME.includes(h) ? h : "trang-chu";
      dat(muc);
      document.title = `${C.thuong_hieu} – ${C.giao_vien} · ${C.chuyen_mon}`;
      if (muc === "trang-chu") window.scrollTo(0, 0);
      else requestAnimationFrame(() => document.getElementById(muc).scrollIntoView());
    }
  }
  function dat(muc) { document.querySelectorAll(".s-nav a").forEach((a) => a.classList.toggle("on", a.dataset.nav === muc)); }
  $("#s-burger").onclick = () => $("#s-nav").classList.toggle("open");
  $("#xoa-tien-do").onclick = () => window.TV9.xoaTienDo();
  window.addEventListener("hashchange", dinhTuyen);
  dinhTuyen();
})();

</script>
</body>
</html>
